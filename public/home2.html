 if(t==='curation')h={k:'IROOM CURATION',t:'오늘의 상황에 맞는 과일을 고릅니다.',l:'당도, 산뜻함, 먹는 시간과 가족 구성을 기준으로 제안합니다.',b:`<div class="cols"><div class="box"><small class="kicker">SWEET</small><h3>당도 높은 과일</h3><p>달콤한 풍미를 중심으로 골라 한 번에 즐기기 좋은 구성입니다.</p></div><div class="box"><small class="kicker">FRESH</small><h3>상큼한 과일</h3><p>가볍고 산뜻한 풍미가 필요한 순간에 어울리는 과일을 모았습니다.</p></div><div class="box"><small class="kicker">FAMILY</small><h3>가족과 함께</h3><p>식감과 풍미를 다양하게 섞어 여러 사람이 나누기 좋게 구성합니다.</p></div></div>`};
 if(t==='picnic')h={k:'PICNIC ROUTINE',t:'과일과 함께하는 가벼운 주말',l:'제철 과일 한 접시와 작은 준비로 일상을 조금 더 특별하게.',b:`<div class="cols"><div class="box"><small class="kicker">LIGHT</small><h3>가볍게 준비하는 피크닉</h3><p>먹기 편한 과일과 작은 보냉백만으로 충분합니다.</p></div><div class="box"><small class="kicker">WEEKEND</small><h3>주말 한 접시</h3><p>${d.label} 제철 과일을 식감과 색이 다르게 3~4가지 고릅니다.</p></div><div class="box"><small class="kicker">GIFT</small><h3>피크닉 선물 구성</h3><p>함께하는 사람에게 전하기 좋은 작은 계절 과일 구성을 제안합니다.</p></div></div>`};
 if(t==='guide')h={k:'FRUIT GUIDE',t:'고르는 법부터 보관과 손질까지',l:'좋은 과일을 더 맛있게 즐길 수 있도록 기본 가이드를 정리했습니다.',b:`<div class="cols"><div class="box"><small class="kicker">SELECT</small><h3>좋은 과일 고르는 법</h3><p>색, 향, 무게감과 단단함을 함께 보고 신선한 과일을 고릅니다.</p></div><div class="box"><small class="kicker">STORAGE</small><h3>오래 보관하는 법</h3><p>과일별 적정 온도와 후숙 여부를 나눠 보관하면 선도를 오래 유지할 수 있습니다.</p></div><div class="box"><small class="kicker">SERVE</small><h3>더 맛있게 먹는 법</h3><p>향과 당도가 살아나는 온도와 손질 타이밍을 맞춰 즐깁니다.</p></div></div>`};
 if(t==='story')h={k:'BRAND STORY',t:'좋은 과일, 좋은 일상',l:'이룸은 제철의 맛과 선도, 보기 좋은 구성의 균형을 중요하게 생각합니다.',b:`<div class="cols"><div class="box"><small class="kicker">01</small><h3>제철</h3><p>계절에 가장 맛이 오른 과일을 우선합니다.</p></div><div class="box"><small class="kicker">02</small><h3>선별</h3><p>맛과 선도, 외관을 균형 있게 확인해 구성합니다.</p></div><div class="box"><small class="kicker">03</small><h3>일상</h3><p>선물뿐 아니라 매일 편하게 즐길 수 있는 과일을 제안합니다.</p></div></div>`};
 if(t==='account')h={k:'MY IROOM',t:'계절 미리보기 · MY IROOM',l:'화면 디자인을 바꾸지 않도록 계절 선택은 이 창 안에 넣었습니다.',b:`<div class="box"><h3>계절 미리보기</h3><p>자동은 현재 월에 맞춰 봄 3–5월 · 여름 6–8월 · 가을 9–11월 · 겨울 12–2월로 전환합니다.</p><div class="season-row"><button data-season="spring">봄</button><button data-season="summer">여름</button><button data-season="autumn">가을</button><button data-season="winter">겨울</button><button data-season="auto">자동</button></div></div>`};
 $('#kicker').textContent=h.k;$('#title').textContent=h.t;$('#lead').textContent=h.l;$('#body').innerHTML=h.b;syncSeasonButtons();open();
}
function detail(p){current=p;$('#detailImg').src=A+p.image;$('#detailKick').textContent=DATA[p.season].label+' SEASON';$('#detailTitle').textContent=p.name;$('#detailDesc').textContent=p.desc;$('#origin').textContent='산지 · '+p.origin;$('#pack').textContent='구성 · '+p.pack;$('#detailPrice').textContent=p.price;$('#qty').value=1;open('detailOverlay')}
function syncSeasonButtons(){$$('[data-season]').forEach(b=>b.classList.toggle('active',(mode==='auto'&&b.dataset.season==='auto')||(mode==='manual'&&b.dataset.season===season)))}
function search(){ $('#kicker').textContent='SEARCH';$('#title').textContent='과일 검색';$('#lead').textContent='봄·여름·가을·겨울 전체 상품에서 검색합니다.';$('#body').innerHTML=`<input class="search" id="searchInput" placeholder="예: 딸기, 사과, 샤인머스캣"><div class="search-grid" id="results">${all().slice(0,16).map(card).join('')}</div>`;open();setTimeout(()=>$('#searchInput').focus(),40)}
function doSearch(v){let q=v.trim().toLowerCase(), arr=all().filter(p=>!q||p.name.toLowerCase().includes(q)||p.origin.toLowerCase().includes(q));$('#results').innerHTML=arr.map(card).join('')||'<p>검색 결과가 없습니다.</p>'}
function saveCart(){try{localStorage.setItem('iroom-v70-cart',JSON.stringify(cart))}catch(_){}}
function loadCart(){try{cart=JSON.parse(localStorage.getItem('iroom-v70-cart')||'[]');if(!Array.isArray(cart))cart=[]}catch(_){cart=[]}}
function add(p,q){let x=cart.find(x=>x.id===p.id);if(x)x.qty+=q;else cart.push({id:p.id,qty:q});saveCart();toast(p.name+' '+q+'개를 장바구니에 담았습니다.')}
function cartView(){let lines=cart.map((x,i)=>{let p=find(x.id);return p?`<div class="cartline"><img src="${A+p.image}" alt=""><div><b>${p.name}</b><small>${DATA[p.season].label} · ${p.price} · ${x.qty}개</small></div><button data-remove="${i}">삭제</button></div>`:''}).join('');$('#kicker').textContent='MY CART';$('#title').textContent='장바구니';$('#lead').textContent='담아둔 상품을 확인합니다.';$('#body').innerHTML=lines||'<div class="box"><p>장바구니가 비어 있습니다.</p></div>';open()}
document.addEventListener('click',e=>{
 let c=e.target.closest('[data-close]');if(c||e.target.classList.contains('overlay')){close();return}
 let m=e.target.closest('[data-menu]');if(m){showMenu(m.dataset.menu);return}
 let pi=e.target.closest('[data-pi]');if(pi){detail(products()[Number(pi.dataset.pi)]);return}
 let p=e.target.closest('[data-prod]');if(p){let x=find(p.dataset.prod);if(x)detail(x);return}
 if(e.target.closest('[data-search]')){search();return}
 if(e.target.closest('[data-cart]')){cartView();return}
 let s=e.target.closest('[data-season]');if(s){if(s.dataset.season==='auto'){mode='auto';del('iroom-v70-season');setSeason('auto')}else{mode='manual';setSeason(s.dataset.season,true)}syncSeasonButtons();toast('계절 화면을 '+(mode==='auto'?'자동':' '+DATA[season].label)+'으로 전환했습니다.');return}
 let q=e.target.closest('[data-q]');if(q){let n=Math.max(1,parseInt($('#qty').value||'1',10)||1);$('#qty').value=Math.max(1,n+Number(q.dataset.q));return}
 if(e.target.closest('[data-add]')&&current){add(current,Math.max(1,parseInt($('#qty').value||'1',10)||1));return}
 if(e.target.closest('[data-buy]')){toast('BUY NOW는 실제 결제 API 연결 전 안내 단계입니다.');return}
 let r=e.target.closest('[data-remove]');if(r){cart.splice(Number(r.dataset.remove),1);saveCart();cartView();return}
 if(e.target.closest('[data-giftprod]')){close();setTimeout(()=>showMenu('fruit'),0);return}
});
document.addEventListener('input',e=>{if(e.target.id==='searchInput')doSearch(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
loadCart();let saved=get('iroom-v70-season');if(saved&&seasons.includes(saved)){mode='manual';setSeason(saved,false)}else{mode='auto';setSeason('auto')};
})();
</script></body></html>
