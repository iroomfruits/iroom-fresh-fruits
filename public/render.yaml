services:
  - type: web
    name: iroom-fresh-fruits
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iroom-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://iroom-fresh-fruits.onrender.com
databases:
  - name: iroom-postgres
    plan: free
