<script>
(()=>{'use strict';
const DATA={"spring": {"label": "봄", "products": [["strawberry", "딸기", "국내산", "500g (15~20과)", "26,000원", "봄의 산뜻한 향과 달콤함을 담은 제철 딸기.", "spring-strawberry.webp"], ["white-strawberry", "화이트딸기", "국내산", "500g (12~16과)", "48,000원", "은은한 단맛과 부드러운 향의 프리미엄 화이트딸기.", "spring-white-strawberry.webp"], ["cherry", "체리", "미국산", "500g (특대과)", "34,000원", "탱글한 식감과 선명한 단맛이 좋은 체리.", "spring-cherry.webp"], ["shine-muscat", "샤인머스캣", "국내산", "2kg (3~4송이)", "46,000원", "향긋하고 높은 당도의 프리미엄 샤인머스캣.", "spring-shine-muscat.webp"], ["grapefruit", "자몽", "미국산", "3kg (6~8과)", "32,000원", "산뜻한 산미와 깨끗한 풍미의 자몽.", "spring-grapefruit.webp"], ["hallabong", "한라봉", "제주산", "3kg (6~8과)", "38,000원", "풍부한 감귤향과 과즙을 즐기는 제주 한라봉.", "spring-hallabong.webp"], ["kiwi", "키위", "국내산", "2kg (16~20과)", "28,000원", "상큼한 산미와 부드러운 과육의 키위.", "spring-kiwi.webp"]]}, "summer": {"label": "여름", "products": [["watermelon", "수박", "국내산", "6~8kg (1통)", "32,000원", "아삭하고 시원한 과즙이 풍부한 여름 수박.", "summer-watermelon.webp"], ["peach", "복숭아", "국내산", "2kg (6~8과)", "34,000원", "부드러운 과육과 향긋한 단맛의 제철 복숭아.", "summer-peach.webp"], ["melon", "멜론", "국내산", "2수 (2kg 내외)", "42,000원", "은은한 향과 촉촉한 과육의 프리미엄 멜론.", "summer-melon.webp"], ["shine-muscat", "샤인머스캣", "국내산", "2kg (3~4송이)", "46,000원", "청포도 향과 달콤함이 선명한 샤인머스캣.", "summer-shine-muscat.webp"], ["plum", "자두", "국내산", "1.5kg (12~15과)", "24,000원", "새콤달콤하고 탱글한 제철 자두.", "summer-plum.webp"], ["apricot", "살구", "국내산", "1kg (12~16과)", "26,000원", "향긋하고 산뜻한 단맛을 즐기는 살구.", "summer-apricot.webp"], ["nectarine", "천도복숭아", "국내산", "2kg (7~9과)", "32,000원", "산뜻한 향과 탄탄한 식감의 천도복숭아.", "summer-nectarine.webp"]]}, "autumn": {"label": "가을", "products": [["apple", "사과", "국내산", "2.5kg (6~10과)", "32,000원", "아삭한 식감과 맑은 단맛이 오래 이어지는 가을 사과.", "autumn-apple.webp"], ["pear", "배", "국내산", "3kg (5~7과)", "36,000원", "시원한 과즙과 깨끗한 단맛을 즐기는 제철 배.", "autumn-pear.webp"], ["shine-muscat", "샤인머스캣", "국내산", "2kg (3~4송이)", "46,000원", "가을에 당도와 향이 더욱 선명해지는 샤인머스캣.", "autumn-shine-muscat.webp"], ["persimmon", "감", "국내산", "2.5kg (8~12과)", "28,000원", "부드럽고 깊은 단맛이 매력적인 가을 감.", "autumn-persimmon.webp"], ["pomegranate", "석류", "이스라엘", "2kg (5~7과)", "40,000원", "붉은 알과 산뜻한 풍미가 매력적인 석류.", "autumn-pomegranate.webp"], ["fig", "무화과", "국내산", "1.5kg (12~16과)", "32,000원", "부드러운 과육과 은은한 단맛의 무화과.", "autumn-fig.webp"], ["chestnut", "밤", "국내산", "1kg (대과)", "24,000원", "고소하고 포근한 풍미를 즐기는 가을 생밤.", "autumn-chestnut.webp"]]}, "winter": {"label": "겨울", "products": [["strawberry", "딸기", "국내산", "500g (특/1팩)", "19,000원", "선명한 향과 달콤한 과즙의 겨울 딸기.", "winter-strawberry.webp"], ["hallabong", "한라봉", "제주산", "2.5kg (6~10과)", "38,000원", "풍부한 향과 과즙이 특징인 제주 한라봉.", "winter-hallabong.webp"], ["redhyang", "레드향", "제주산", "2kg (5~8과)", "42,000원", "진한 감귤향과 깊은 단맛의 레드향.", "winter-redhyang.webp"], ["cheonhyehyang", "천혜향", "제주산", "2kg (5~8과)", "36,000원", "부드러운 과육과 향긋한 단맛의 천혜향.", "winter-cheonhyehyang.webp"], ["apple", "사과", "국내산", "2.5kg (6~10과)", "32,000원", "차가운 계절에 더욱 아삭한 겨울 사과.", "winter-apple.webp"], ["pear", "배", "국내산", "3kg (6~8과)", "36,000원", "시원한 과즙과 은은한 단맛의 겨울 배.", "winter-pear.webp"], ["mandarin", "감귤", "제주산", "3kg (특/로얄과)", "28,000원", "상큼한 향과 달콤한 과즙의 제주 감귤.", "winter-mandarin.webp"]]}}, A='./assets/home2-v73/', seasons=['spring','summer','autumn','winter'];
let season='autumn',mode='auto',current=null,cart=[],timer;
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
const get=k=>{try{return localStorage.getItem(k)}catch(_){return null}}, set=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}}, del=k=>{try{localStorage.removeItem(k)}catch(_){}};
const detect=()=>{let m=new Date().getMonth()+1;return m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter'};
function normalize(){for(const s of seasons)DATA[s].products=DATA[s].products.map(p=>({slug:p[0],name:p[1],origin:p[2],pack:p[3],price:p[4],desc:p[5],image:p[6],season:s,id:s+':'+p[0]}))}normalize();
const products=()=>DATA[season].products, all=()=>seasons.flatMap(s=>DATA[s].products), find=id=>all().find(p=>p.id===id);
function setSeason(s,manual=false){if(s==='auto'){mode='auto';del('iroom-v70-season');s=detect()}else{mode=manual?'manual':'auto';if(manual)set('iroom-v70-season',s)}season=s;$('#pageImage').src=A+'page-'+s+'.png';$('#pageImage').alt='이룸 fresh fruits '+DATA[s].label+' 홈페이지';}
function open(which='overlay'){$('#overlay').hidden=true;$('#detailOverlay').hidden=true;$('#'+which).hidden=false;document.body.classList.add('lock')}
function close(){ $('#overlay').hidden=true;$('#detailOverlay').hidden=true;document.body.classList.remove('lock')}
function toast(m){let t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,1800)}
function card(p){return `<button class="card" data-prod="${p.id}"><img src="${A+p.image}" alt="${p.name}"><span class="b"><strong>${p.name}</strong><small>프리미엄 · ${p.origin}<br>${p.pack}</small><span class="price">${p.price}</span></span></button>`}


function setDialogMode(mode){
 const d=$('#mainDialog'), h=$('.dhead',d);
 d.classList.toggle('editorial',mode==='editorial');
 d.classList.toggle('menu-lock',mode==='lock');
 if(h)h.style.display=mode==='standard'?'block':'none';
}
function lockedMenuHTML(t){
 let img=A+`menu-${t}-${season}.webp`;
 let extra='';
 // The approved seasonal-fruit page has 7 clickable product areas in the 4x2 grid.
 if(t==='fruit'){
   const coords=[
    [26.0,13.0,16.4,38.0],[43.2,13.0,16.4,38.0],[60.4,13.0,16.4,38.0],[77.6,13.0,16.4,38.0],
    [26.0,53.0,16.4,38.0],[43.2,53.0,16.4,38.0],[60.4,53.0,16.4,38.0]
   ];
   extra=coords.map((c,i)=>`<button class="menu-prod" data-pi="${i}" aria-label="${products()[i]?.name||'상품'}" style="left:${c[0]}%;top:${c[1]}%;width:${c[2]}%;height:${c[3]}%"></button>`).join('');
 }
 if(t==='gift'){
   const coords=[[26,13,22,37],[49.2,13,22,37],[72.4,13,22,37],[26,53,22,37],[49.2,53,22,37],[72.4,53,22,37]];
   extra=coords.map((c,i)=>`<button class="menu-prod" data-toast="선물 구성 ${i+1} 상세 상담을 준비 중입니다." style="left:${c[0]}%;top:${c[1]}%;width:${c[2]}%;height:${c[3]}%"></button>`).join('');
 }
 if(t==='curation'){
   const coords=[[26,13,22,37],[49.2,13,22,37],[72.4,13,22,37],[26,53,22,37],[49.2,53,22,37],[72.4,53,22,37]];
   extra=coords.map((c,i)=>`<button class="menu-prod" data-toast="큐레이션 ${i+1} 구성을 준비 중입니다." style="left:${c[0]}%;top:${c[1]}%;width:${c[2]}%;height:${c[3]}%"></button>`).join('');
 }
 if(t==='picnic'){
   const coords=[[10,60,27,34],[39,60,27,34],[68,60,27,34]];
   extra=coords.map((c,i)=>`<button class="menu-prod" data-toast="피크닉 제안 ${i+1}을 준비 중입니다." style="left:${c[0]}%;top:${c[1]}%;width:${c[2]}%;height:${c[3]}%"></button>`).join('');
 }
 return `<div class="menu-lock-wrap"><img src="${img}" alt="${DATA[season].label} ${t} 페이지">
 <button class="menu-hot nav1" data-menu="fruit" aria-label="제철 과일"></button>
 <button class="menu-hot nav2" data-menu="gift" aria-label="선물세트"></button>
 <button class="menu-hot nav3" data-menu="curation" aria-label="과일 큐레이션"></button>
 <button class="menu-hot nav4" data-menu="picnic" aria-label="피크닉 루틴"></button>
 <button class="menu-hot nav5" data-menu="guide" aria-label="과일 가이드"></button>
 <button class="menu-hot nav6" data-menu="story" aria-label="이룸의 이야기"></button>${extra}</div>`;
}
function showMenu(t){
 if(t==='account'){
   setDialogMode('standard');
   $('#kicker').textContent='MY IROOM';$('#title').textContent='계절 미리보기 · MY IROOM';$('#lead').textContent='메인 화면 디자인을 바꾸지 않도록 계절 선택은 이 창 안에 넣었습니다.';
   $('#body').innerHTML=`<div class="box"><h3>계절 미리보기</h3><p>자동은 현재 월에 맞춰 봄 3–5월 · 여름 6–8월 · 가을 9–11월 · 겨울 12–2월로 전환합니다.</p><div class="season-row"><button data-season="spring">봄</button><button data-season="summer">여름</button><button data-season="autumn">가을</button><button data-season="winter">겨울</button><button data-season="auto">자동</button></div></div>`;
   syncSeasonButtons();open();return;
 }
 setDialogMode('lock');
 $('#body').innerHTML=lockedMenuHTML(t);
 open();
}
function detail(p){current=p;$('#detailImg').src=A+p.image;$('#detailKick').textContent=DATA[p.season].label+' SEASON';$('#detailTitle').textContent=p.name;$('#detailDesc').textContent=p.desc;$('#origin').textContent='산지 · '+p.origin;$('#pack').textContent='구성 · '+p.pack;$('#detailPrice').textContent=p.price;$('#qty').value=1;open('detailOverlay')}
function syncSeasonButtons(){$$('[data-season]').forEach(b=>b.classList.toggle('active',(mode==='auto'&&b.dataset.season==='auto')||(mode==='manual'&&b.dataset.season===season)))}
function search(){ setDialogMode('standard');$('#kicker').textContent='SEARCH';$('#title').textContent='과일 검색';$('#lead').textContent='봄·여름·가을·겨울 전체 상품에서 검색합니다.';$('#body').innerHTML=`<input class="search" id="searchInput" placeholder="예: 딸기, 사과, 샤인머스캣"><div class="search-grid" id="results">${all().slice(0,16).map(card).join('')}</div>`;open();setTimeout(()=>$('#searchInput').focus(),40)}
function doSearch(v){let q=v.trim().toLowerCase(), arr=all().filter(p=>!q||p.name.toLowerCase().includes(q)||p.origin.toLowerCase().includes(q));$('#results').innerHTML=arr.map(card).join('')||'<p>검색 결과가 없습니다.</p>'}
function saveCart(){try{localStorage.setItem('iroom-v70-cart',JSON.stringify(cart))}catch(_){}}
function loadCart(){try{cart=JSON.parse(localStorage.getItem('iroom-v70-cart')||'[]');if(!Array.isArray(cart))cart=[]}catch(_){cart=[]}}
function add(p,q){let x=cart.find(x=>x.id===p.id);if(x)x.qty+=q;else cart.push({id:p.id,qty:q});saveCart();toast(p.name+' '+q+'개를 장바구니에 담았습니다.')}
function cartView(){setDialogMode('standard');let lines=cart.map((x,i)=>{let p=find(x.id);return p?`<div class="cartline"><img src="${A+p.image}" alt=""><div><b>${p.name}</b><small>${DATA[p.season].label} · ${p.price} · ${x.qty}개</small></div><button data-remove="${i}">삭제</button></div>`:''}).join('');$('#kicker').textContent='MY CART';$('#title').textContent='장바구니';$('#lead').textContent='담아둔 상품을 확인합니다.';$('#body').innerHTML=lines||'<div class="box"><p>장바구니가 비어 있습니다.</p></div>';open()}
document.addEventListener('click',e=>{
 let c=e.target.closest('[data-close]');if(c||e.target.classList.contains('overlay')){close();return}
 let m=e.target.closest('[data-menu]');if(m){showMenu(m.dataset.menu);return}
 let pi=e.target.closest('[data-pi]');if(pi){detail(products()[Number(pi.dataset.pi)]);return}
 let p=e.target.closest('[data-prod]');if(p){let x=find(p.dataset.prod);if(x)detail(x);return}
 if(e.target.closest('[data-search]')){search();return}
 if(e.target.closest('[data-cart]')){cartView();return}
 let s=e.target.closest('[data-season]');if(s){if(s.dataset.season==='auto'){mode='auto';del('iroom-v70-season');setSeason('auto')}else{mode='manual';setSeason(s.dataset.season,true)}syncSeasonButtons();toast('계절 화면을 '+(mode==='auto'?'자동':' '+DATA[season].label)+'으로 전환했습니다.');return}
 let q=e.target.closest('[data-q]');if(q){let n=Math.max(1,parseInt($('#qty').value||'1',10)||1);$('#qty').value=Math.max(1,n+Number(q.dataset.q));return}
 if(e.target.closest('[data-add]')&&current){add(current,Math.max(1,parseInt($('#qty').value||'1',10)||1));return}
 if(e.target.closest('[data-buy]')){toast('BUY NOW는 실제 결제 API 연결 전 안내 단계입니다.');return}
 let r=e.target.closest('[data-remove]');if(r){cart.splice(Number(r.dataset.remove),1);saveCart();cartView();return}
 let tt=e.target.closest('[data-toast]');if(tt){toast(tt.dataset.toast);return}
 if(e.target.closest('[data-giftprod]')){close();setTimeout(()=>showMenu('fruit'),0);return}
});
document.addEventListener('input',e=>{if(e.target.id==='searchInput')doSearch(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
loadCart();let saved=get('iroom-v70-season');if(saved&&seasons.includes(saved)){mode='manual';setSeason(saved,false)}else{mode='auto';setSeason('auto')};
})();
</script></body></html>
