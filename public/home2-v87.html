  {id:'summer-plum',name:'자두',origin:'국내산',pack:'1.5kg',price:24000,asset:'soft-summer-plum.webp',grade:'GRADE AA'},
  {id:'summer-nectarine',name:'천도복숭아',origin:'국내산',pack:'2kg',price:32000,asset:'soft-summer-nectarine.webp',grade:'GRADE AA'}
 ],
 winter:[
  {id:'winter-strawberry',name:'딸기',origin:'국내산',pack:'500g',price:24000,asset:'soft-winter-strawberry.webp',grade:'GRADE AA'},
  {id:'winter-hallabong',name:'한라봉',origin:'제주산',pack:'2kg',price:28000,asset:'soft-winter-hallabong.webp',grade:'GRADE AA'},
  {id:'winter-redhyang',name:'레드향',origin:'제주산',pack:'2kg',price:46000,asset:'soft-winter-redhyang.webp',grade:'GRADE AA'},
  {id:'winter-cheonhyehyang',name:'천혜향',origin:'제주산',pack:'2kg',price:42000,asset:'soft-winter-cheonhyehyang.webp',grade:'GRADE AA'},
  {id:'winter-apple',name:'사과',origin:'국내산',pack:'1.5kg',price:36000,asset:'soft-winter-apple.webp',grade:'GRADE AA'},
  {id:'winter-pear',name:'배',origin:'국내산',pack:'2kg',price:34000,asset:'soft-winter-pear.webp',grade:'GRADE AA'},
  {id:'winter-kiwi',name:'키위',origin:'국내산',pack:'1kg',price:34000,asset:'soft-winter-kiwi.webp',grade:'GRADE AA'}
 ]
};
const labels={spring:'봄',summer:'여름',autumn:'가을',winter:'겨울'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>n.toLocaleString('ko-KR')+'원';
const cutoutAsset=(asset)=>asset.replace(/\.(png|webp)$/,'-cutout.png');
const img=p=>A+cutoutAsset(p.asset);
const all=()=>Object.values(DATA).flat(); const find=id=>all().find(p=>p.id===id);
let route='home',season='autumn',heroIndex=0,slideIndex=0,cart=[],lastFocus=null,timer=null,heroTimer=null;
function setNotice(){const slides=$('#noticeSlides');if(!slides)return;let second=false;setInterval(()=>{second=!second;slides.classList.toggle('showSecond',second)},4600)}
function card(p,compact=false){return `<article class="productCard"><button class="productImgBtn" data-product="${p.id}"><img src="${img(p)}" alt="${p.name}"></button><div class="productName">${p.name}</div><div class="productSpec">${p.grade}<br>${p.pack} · ${p.origin}</div><div class="productPrice">${fmt(p.price)}</div><button class="cartBar" data-add="${p.id}"><span>ADD TO CART</span><span>＋</span></button></article>`}
function curation(i,title,sub,p){return `<article class="curationCard"><div class="curationText"><h3>${title}</h3><p>${sub}</p><button class="smallArrow" data-product="${p.id}">→</button></div><div class="curationImg"><img src="${img(p)}" alt="${p.name}"></div></article>`}
function home(){const ps=DATA.autumn;const h=ps[heroIndex%Math.min(ps.length,5)];return `<div class="shell">
<section class="hero homeSection"><div class="heroCopy"><span class="eyebrow">SEASONAL FRUITS</span><h1>햇살 아래,<br>싱그러운 일상</h1><p>계절이 건네는 가장 좋은 과일을<br>이룸이 정성껏 전해드립니다.</p><button class="outlineBtn" data-product="${h.id}">지금, ${h.name} 만나보기 →</button><div class="heroDots">${ps.slice(0,5).map((p,i)=>`<button class="dotBtn ${i===heroIndex?'active':''}" data-hero="${i}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div></div><div class="heroVisual"><img id="heroImage" src="${h.heroAsset?A+h.heroAsset:img(h)}" alt="${h.name}"><div class="heroMeta">이번 계절의 특별함<br><b>${h.name}</b></div></div><div class="heroArrows"><button class="circleArrow" data-hero-prev>‹</button><button class="circleArrow" data-hero-next>›</button></div></section>
<section class="section homeSection"><div class="sectionHead"><div><h2>지금, 가장 맛있는 제철 과일 <span>SEASONAL PICKS</span></h2></div><button class="textLink" data-route="fruits">전체 상품 보기 →</button></div><div class="sliderWrap"><button class="sliderBtn prev" data-slide-prev>‹</button><div class="cardsViewport"><div class="cardsTrack" id="cardsTrack">${ps.map(p=>card(p)).join('')}</div></div><button class="sliderBtn next" data-slide-next>›</button><div class="sliderDots" id="sliderDots"></div></div></section>
<section class="section homeSection"><div class="sectionHead"><div><h2>맞춤 과일 <span>FRUIT CURATION</span></h2></div><button class="textLink" data-route="curation">나에게 맞는 과일 찾기 →</button></div><div class="curationGrid">${curation(0,'아침을 여는 과일','산뜻한 하루를 위한 선택',ps[2])}${curation(1,'정성을 전하는 선물','마음을 담은 특별한 선택',ps[0])}${curation(2,'아이를 위한 한입','부드럽고 편안한 달콤함',ps[3])}</div></section>
<section class="homeSection"><div class="storyStrip"><span class="eyebrow">BRAND STORY</span><h3>좋은 과일이 만드는<br>더 나은 일상, 이룸</h3><p>제철의 신선함을 쉽게 고르고 편하게 받을 수 있도록,<br>이룸은 좋은 과일을 정성껏 선별합니다.</p><button class="storyBtn" data-route="story">이룸의 이야기 보기 →</button></div></section>
</div>`}
function fruitsPage(){let ps=season==='all'?all():DATA[season];return `<section class="routePage"><div class="routeHero"><div><span class="eyebrow">SEASONAL PICKS</span><h1>제철 과일</h1></div><p>계절에 맞는 과일을 한눈에 비교하고 바로 고를 수 있도록 정리했습니다.</p></div><div class="seasonTabs"><button class="seasonTab ${season==='all'?'active':''}" data-season="all">전체</button>${Object.keys(DATA).map(s=>`<button class="seasonTab ${s===season?'active':''}" data-season="${s}">${labels[s]}</button>`).join('')}</div><div class="catalogGrid">${ps.map(p=>card(p)).join('')}</div></section>`}
function curationPage(){const ps=[...DATA.autumn,...DATA.winter,...DATA.spring].slice(0,12);return `<section class="routePage"><div class="routeHero"><div><span class="eyebrow">FRUIT CURATION</span><h1>맞춤 과일</h1></div><p>먹는 순간과 목적에 맞춰 지금 고르기 좋은 과일을 제안합니다.</p></div><div class="curationGrid" style="margin-top:24px">${curation(0,'아침을 여는 과일','가볍게 시작하는 한 접시',ps[2])}${curation(1,'정성을 전하는 선물','마음을 전하기 좋은 과일',ps[0])}${curation(2,'아이를 위한 한입','부드럽고 편안한 달콤함',ps[3])}${curation(3,'가족과 함께','나누기 좋은 균형 잡힌 구성',ps[1])}${curation(4,'상큼한 한 접시','산뜻하게 즐기기 좋은 과일',ps[8])}${curation(5,'이룸 상위 선별','모양·선도·구성을 더 엄격하게',ps[4])}</div><div class="sectionHead" style="margin-top:36px"><h2>추천 상품</h2></div><div class="catalogGrid">${ps.slice(0,10).map(p=>card(p)).join('')}</div></section>`}
function giftsPage(){const p=DATA.autumn;const gifts=[['프리미엄 제철 선물',p[0]],['사과·배 정성 선물',p[2]],['기업·단체 선물',p[1]],['가족 과일 선물',p[3]],['이룸 셀렉트 선물',p[5]],['감사 과일 선물',p[6]]];return `<section class="routePage"><div class="routeHero"><div><span class="eyebrow">GIFT SELECTION</span><h1>선물세트</h1></div><p>받는 분과 예산에 맞춰 좋은 과일을 정갈하게 구성합니다.</p></div><div class="giftGrid" style="margin-top:24px">${gifts.map(([n,p],i)=>`<article class="giftCard"><div class="giftVisual"><img src="${img(p)}" alt="${n}"></div><div><h3>${n}</h3><p>${p.name} 중심의 계절 맞춤 구성 · ${fmt(p.price+30000)}</p><button class="outlineBtn" data-product="${p.id}">선물 보기 →</button></div></article>`).join('')}</div></section>`}
function storyPage(){return `<section class="routePage"><div class="routeHero"><div><span class="eyebrow">BRAND STORY</span><h1>좋은 과일을 더 잘 고르고,<br>더 쉽게 전합니다.</h1></div><p>이룸은 계절에 가장 좋은 과일을 고르고, 이해하기 쉽게 보여주고, 편하게 주문할 수 있도록 만듭니다.</p></div><div class="storyPageGrid"><div class="storyBlock"><span class="eyebrow">OUR STANDARD</span><h3>이룸의 기준</h3><p>신선함, 선별, 일상. 세 가지 기준으로 지금 가장 좋은 과일을 고릅니다.</p></div><div class="storyBlock"><span class="eyebrow">01</span><h3>신선함</h3><p>입고와 선도를 우선해 설명합니다.</p></div><div class="storyBlock"><span class="eyebrow">02</span><h3>선별</h3><p>크기보다 맛과 균형을 함께 봅니다.</p></div><div class="storyBlock"><span class="eyebrow">03</span><h3>일상</h3><p>쉽게 비교하고 바로 주문할 수 있게 만듭니다.</p></div></div></section>`}
function render(){clearInterval(heroTimer);$$('.navItem').forEach(n=>n.classList.toggle('active',n.dataset.route===route));$('#app').innerHTML=route==='home'?home():route==='fruits'?fruitsPage():route==='curation'?curationPage():route==='gifts'?giftsPage():storyPage();if(route==='home'){updateSlider();heroTimer=setInterval(()=>{heroIndex=(heroIndex+1)%5;render()},5200)}}
function go(r){route=r;if(r==='fruits')season='all';history.pushState({},'',r==='home'?'#':'#'+r);closeDetail();closeCart();render();scrollTo({top:0,behavior:'smooth'})}
function updateSlider(){const track=$('#cardsTrack');if(!track)return;const visible=innerWidth<=760?1:innerWidth<=1100?2:4;const max=Math.max(0,DATA.autumn.length-visible);slideIndex=Math.min(slideIndex,max);const gap=14;const pct=100/visible;track.style.transform=`translateX(calc(-${slideIndex*pct}% - ${slideIndex*gap/visible}px))`;const dots=$('#sliderDots');if(dots)dots.innerHTML=Array.from({length:max+1},(_,i)=>`<i class="${i===slideIndex?'active':''}"></i>`).join('')}
function saveCart(){try{localStorage.setItem('iroom-v87-cart',JSON.stringify(cart))}catch{}const n=cart.reduce((s,x)=>s+x.qty,0);$('#badge').textContent=n;$('#badge').hidden=!n;if(!$('#drawer').hidden)drawCart()}
function loadCart(){try{cart=JSON.parse(localStorage.getItem('iroom-v87-cart')||'[]')}catch{cart=[]}if(!Array.isArray(cart))cart=[];saveCart()}
function add(id,qty=1){const x=cart.find(v=>v.id===id);if(x)x.qty+=qty;else cart.push({id,qty});saveCart();toast((find(id)?.name||'상품')+'을 담았습니다.')}
function drawCart(){if(!cart.length){$('#cartBody').innerHTML='<p style="padding:30px 0;color:#788079">장바구니가 비어 있습니다.</p>';$('#cartTotal').textContent='0원';return}$('#cartBody').innerHTML=cart.map((x,i)=>{const p=find(x.id);if(!p)return'';return `<div class="cartLine"><img src="${img(p)}" alt="${p.name}"><div><h4>${p.name}</h4><small>${fmt(p.price)}</small><div class="cartQty"><button data-cqty="${i}:-1">−</button><b>${x.qty}</b><button data-cqty="${i}:1">＋</button></div></div><button class="remove" data-remove="${i}">삭제</button></div>`}).join('');$('#cartTotal').textContent=fmt(cart.reduce((s,x)=>s+(find(x.id)?.price||0)*x.qty,0))}
function openCart(){drawCart();$('#scrim').hidden=false;$('#drawer').hidden=false;document.body.classList.add('lock')}function closeCart(){$('#scrim').hidden=true;$('#drawer').hidden=true;document.body.classList.remove('lock')}
function openDetail(id){const p=find(id);if(!p)return;lastFocus=document.activeElement;$('#detailSheet').innerHTML=`<button class="detailClose" data-detail-close>×</button><div class="detailTop"><div class="detailVisual"><img src="${img(p)}" alt="${p.name}"></div><div class="detailInfo"><span class="eyebrow">IROOM SELECT</span><h1>${p.name}</h1><div class="detailPrice">${fmt(p.price)}</div><div class="infoRows"><div class="infoRow"><span>등급</span><b>${p.grade}</b></div><div class="infoRow"><span>산지</span><b>${p.origin}</b></div><div class="infoRow"><span>구성</span><b>${p.pack}</b></div><div class="infoRow"><span>배송</span><b>신선식품 포장 · 출고 안내</b></div></div><div class="qtyLine"><div class="qty"><button data-qty="-1">−</button><input id="qty" value="1"><button data-qty="1">＋</button></div><strong id="sum">${fmt(p.price)}</strong></div><div class="detailActions"><button data-detail-add="${p.id}">장바구니 담기</button><button class="dark" data-demo>BUY NOW</button></div></div></div><div class="detailNotes"><div><span class="eyebrow">PRODUCT</span><h3>상품 안내</h3><p>입고 상태에 따라 크기와 색감에는 자연스러운 차이가 있습니다.</p></div><div><span class="eyebrow">STORAGE</span><h3>보관 가이드</h3><p>수령 후 상태와 후숙 여부에 맞춰 보관하세요.</p></div><div><span class="eyebrow">DELIVERY</span><h3>배송 안내</h3><p>신선식품 특성에 맞춰 안전하게 포장해 출고합니다.</p></div></div>`;$('#detailOverlay').dataset.id=id;$('#detailOverlay').hidden=false;document.body.classList.add('lock');requestAnimationFrame(()=>$('#detailSheet .detailClose')?.focus())}
function closeDetail(){if($('#detailOverlay').hidden)return;$('#detailOverlay').hidden=true;$('#detailSheet').innerHTML='';document.body.classList.remove('lock');if(lastFocus&&lastFocus.focus){const f=lastFocus;requestAnimationFrame(()=>f.focus());}lastFocus=null}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(timer);timer=setTimeout(()=>el.hidden=true,1600)}
function qty(){return Math.max(1,parseInt($('#qty')?.value||'1'))}
document.addEventListener('click',e=>{const r=e.target.closest('[data-route]');if(r){go(r.dataset.route);return}const p=e.target.closest('[data-product]');if(p){openDetail(p.dataset.product);return}const a=e.target.closest('[data-add]');if(a){add(a.dataset.add);return}if(e.target.closest('[data-cart]')){openCart();return}if(e.target.closest('[data-close-cart]')||e.target.id==='scrim'){closeCart();return}if(e.target.closest('[data-detail-close]')||e.target.id==='detailOverlay'){closeDetail();return}const da=e.target.closest('[data-detail-add]');if(da){add(da.dataset.detailAdd,qty());return}const q=e.target.closest('[data-qty]');if(q){const i=$('#qty');i.value=Math.max(1,qty()+Number(q.dataset.qty));$('#sum').textContent=fmt(find($('#detailOverlay').dataset.id).price*qty());return}const cq=e.target.closest('[data-cqty]');if(cq){const [i,d]=cq.dataset.cqty.split(':').map(Number);cart[i].qty=Math.max(1,cart[i].qty+d);saveCart();return}const rm=e.target.closest('[data-remove]');if(rm){cart.splice(Number(rm.dataset.remove),1);saveCart();return}const ss=e.target.closest('[data-season]');if(ss){season=ss.dataset.season;render();return}const hb=e.target.closest('[data-hero]');if(hb){heroIndex=Number(hb.dataset.hero);render();return}if(e.target.closest('[data-hero-next]')){heroIndex=(heroIndex+1)%5;render();return}if(e.target.closest('[data-hero-prev]')){heroIndex=(heroIndex+4)%5;render();return}if(e.target.closest('[data-slide-next]')){slideIndex++;updateSlider();return}if(e.target.closest('[data-slide-prev]')){slideIndex=Math.max(0,slideIndex-1);updateSlider();return}if(e.target.closest('[data-demo]')){toast('기존 백엔드 연결 단계에서 활성화됩니다.');return}})
document.addEventListener('input',e=>{if(e.target.id==='qty')$('#sum').textContent=fmt(find($('#detailOverlay').dataset.id).price*qty())})
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#detailOverlay').hidden){e.preventDefault();closeDetail();return}if(!$('#drawer').hidden){e.preventDefault();closeCart();return}}if(e.key==='Tab')document.body.classList.add('keyboardNav')},true);document.addEventListener('pointerdown',()=>document.body.classList.remove('keyboardNav'),true);window.addEventListener('resize',updateSlider);window.addEventListener('popstate',()=>{const h=location.hash.slice(1);route=['fruits','curation','gifts','story'].includes(h)?h:'home';render()});
setNotice();loadCart();const h=location.hash.slice(1);route=['fruits','curation','gifts','story'].includes(h)?h:'home';render();
})();
</script>
</body>
</html>
