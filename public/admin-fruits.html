<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>맞춤과일 관리 | 이룸 관리자</title><style>
:root{--g:#073b2c;--gold:#b88a3f;--cream:#fbf7ee;--line:#dfd2bd;--muted:#6e685f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#17382a;font-family:Pretendard,"Noto Sans KR",sans-serif}.top{position:sticky;top:0;z-index:10;background:var(--g);color:#fff;padding:15px 24px;display:flex;align-items:center;gap:16px}.top a,.top button{color:#fff;background:transparent;border:0;font-weight:800;text-decoration:none;cursor:pointer}.top h1{font-size:18px;margin:0;flex:1}.wrap{max-width:1280px;margin:28px auto;padding:0 20px}.notice{padding:14px 16px;border:1px solid #d8c49e;border-radius:12px;background:#fff9ed;font-size:13px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:800}.tabs .on{background:var(--g);color:#fff}.panel{background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(53,40,19,.05)}.panel h2{margin:0 0 18px}.section{margin:20px 0 0;border:1px solid #e7dccb;border-radius:14px;overflow:hidden}.section h3{margin:0;padding:13px 16px;background:#f5eee2;font-size:14px;color:var(--g)}.grid{display:grid;grid-template-columns:repeat(4,1fr)}.field{padding:13px;border-right:1px solid #eee5d8;border-bottom:1px solid #eee5d8}.field.w2{grid-column:span 2}.field.w4{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.req{color:#b04a38}input,select,textarea{width:100%;border:1px solid #d9cfbf;background:#fff;border-radius:8px;padding:10px;font:inherit}textarea{min-height:120px;resize:vertical}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{font-weight:700}.checks input{width:auto;margin-right:6px}.images{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drop{border:1px dashed #bfa678;background:#fbf8f1;border-radius:12px;padding:20px;text-align:center}.actions{position:sticky;bottom:0;margin-top:20px;padding:14px;background:rgba(251,247,238,.96);display:flex;justify-content:flex-end;gap:10px}.actions button{border:1px solid var(--g);border-radius:10px;padding:12px 20px;font-weight:900;background:#fff;color:var(--g)}.actions .save{background:var(--g);color:#fff}.status{font-size:13px;margin-right:auto;align-self:center}.list{margin-top:18px;width:100%;border-collapse:collapse;background:#fff}.list th,.list td{padding:11px;border:1px solid #e7dccb;text-align:left;font-size:12px}.list th{background:#f5eee2}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.field.w4{grid-column:1/-1}}@media(max-width:560px){.grid,.images{grid-template-columns:1fr}.field,.field.w2,.field.w4{grid-column:1}.top{padding:13px}.wrap{padding:0 10px}.panel{padding:13px}.list{display:block;overflow:auto}}
</style></head><body><header class="top"><button type="button" onclick="history.length>1?history.back():location.href='/band-admin.html'" title="이전 화면" aria-label="이전 화면">←</button><h1>맞춤과일 상품 관리</h1><a href="/band-admin.html">관리자 홈</a><button id="logout">로그아웃</button></header><main class="wrap"><div id="authNotice" class="notice">기존 관리자 인증 세션을 확인하고 있습니다…</div><div id="app" class="hidden"><div class="tabs"><button class="on">상품 등록</button><button id="listTab">등록 상품</button></div><form id="fruitForm" class="panel"><h2>맞춤과일 업로드 · 등록</h2>
<section class="section"><h3>기본 정보</h3><div class="grid"><div class="field w2"><label>상품명 <span class="req">*</span></label><input name="name" required placeholder="예: 여름 프리미엄 애플망고 세트"></div><div class="field"><label>카테고리 <span class="req">*</span></label><select name="category" required><option value="">선택</option><option>맞춤과일</option><option>과일선물세트</option><option>가정용</option><option>기업·단체</option></select></div><div class="field"><label>계절</label><select name="season"><option>사계절</option><option>봄</option><option>여름</option><option>가을</option><option>겨울</option></select></div><div class="field w2"><label>추천 대상 / 상황</label><input name="target" placeholder="부모님 선물, 출산·병문안, 가족 간식, 기업 답례"></div><div class="field w2"><label>과일 구성</label><input name="composition" placeholder="애플망고 6과, 샤인머스켓 1송이 등"></div></div></section>
<section class="section"><h3>규격 · 품질 정보</h3><div class="grid"><div class="field"><label>옵션 / 규격</label><input name="options" placeholder="소 / 중 / 대, 6과 / 9과"></div><div class="field"><label>중량</label><input name="weight" placeholder="2.5kg 내외"></div><div class="field"><label>원산지</label><input name="origin" placeholder="제주특별자치도"></div><div class="field"><label>등급</label><input name="grade" placeholder="특 / 상 / 프리미엄 선별"></div><div class="field w4"><label>당도 / 특징</label><input name="features" placeholder="평균 14브릭스 이상, 진한 향, 부드러운 과육"></div></div></section>
<section class="section"><h3>가격 · 재고 · 판매</h3><div class="grid"><div class="field"><label>정상가</label><input name="regularPrice" type="number" min="0" step="100" placeholder="79000"></div><div class="field"><label>판매가 <span class="req">*</span></label><input name="salePrice" type="number" min="0" step="100" required placeholder="69000"></div><div class="field"><label>재고</label><input name="stock" type="number" min="0" value="0"></div><div class="field"><label>판매 상태</label><select name="status"><option>판매중</option><option>예약판매</option><option>품절</option><option>판매중지</option><option>숨김</option></select></div></div></section>
<section class="section"><h3>이미지 · 상세 설명</h3><div class="grid"><div class="field w4"><div class="images"><div class="drop"><label>대표 이미지 <span class="req">*</span></label><input name="mainImage" type="file" accept="image/*" required><small>권장 1200×1200px, JPG/PNG/WebP</small></div><div class="drop"><label>추가 이미지</label><input name="extraImages" type="file" accept="image/*" multiple><small>구성·포장·단면 사진, 여러 장 선택 가능</small></div></div></div><div class="field w4"><label>상세 설명</label><textarea name="description" placeholder="선별 기준, 맛과 향, 보관법, 섭취 시기, 교환·반품 유의사항을 입력하세요."></textarea></div></div></section>
<section class="section"><h3>포장 · 배송 · 노출</h3><div class="grid"><div class="field"><label>선물포장 여부</label><select name="giftWrap"><option>가능</option><option>기본 포함</option><option>불가</option></select></div><div class="field"><label>선물포장 옵션</label><input name="giftOptions" placeholder="보자기, 리본, 메시지카드"></div><div class="field"><label>배송 방법</label><select name="shippingMethod"><option>택배</option><option>퀵배송</option><option>매장 픽업</option><option>협의 배송</option></select></div><div class="field"><label>배송비</label><input name="shippingFee" type="number" min="0" value="0"></div><div class="field"><label>출고일</label><input name="shipDate" type="date"></div><div class="field"><label>예약 배송</label><select name="reservation"><option>가능</option><option>불가</option><option>상담 후 확정</option></select></div><div class="field"><label>노출 순서</label><input name="displayOrder" type="number" min="0" value="100"></div><div class="field"><label>표시 설정</label><div class="checks"><label><input name="recommended" type="checkbox">추천</label><label><input name="best" type="checkbox">BEST</label><label><input name="newItem" type="checkbox">NEW</label></div></div></div></section>
<div class="actions"><span id="saveStatus" class="status"></span><button type="reset">초기화</button><button type="button" id="draft">임시저장</button><button class="save" type="submit">상품 등록</button></div></form><table class="list" id="fruitList"><thead><tr><th>순서</th><th>상품명</th><th>계절</th><th>판매가</th><th>재고</th><th>상태</th><th>표시</th></tr></thead><tbody></tbody></table></div></main><script>
const app=document.querySelector('#app'),notice=document.querySelector('#authNotice'),form=document.querySelector('#fruitForm'),statusEl=document.querySelector('#saveStatus');
async function requireAdmin(){try{const r=await fetch('/api/admin/session',{credentials:'same-origin'});if(!r.ok)throw 0;notice.textContent='관리자 인증 세션을 그대로 사용해 바로 연결되었습니다.';app.classList.remove('hidden');loadList()}catch(e){notice.textContent='관리자 세션이 만료되었습니다. 관리자 홈에서 한 번만 로그인하면 이 화면에서 다시 묻지 않습니다.';setTimeout(()=>location.href='/band-admin.html?next='+encodeURIComponent(location.pathname),900)}}
function data(){const f=new FormData(form),o={};for(const [k,v] of f.entries()){if(v instanceof File){if(v.name)o[k]=(o[k]?[].concat(o[k],v.name):v.name)}else o[k]=v}for(const k of ['recommended','best','newItem'])o[k]=form.elements[k].checked;return o}
async function save(draft){statusEl.textContent='저장 중…';const body=data();body.draft=draft;try{const r=await fetch('/api/admin/fruits',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});if(!r.ok)throw 0;statusEl.textContent=draft?'임시저장했습니다.':'상품을 등록했습니다.';if(!draft)form.reset();loadList()}catch(e){localStorage.setItem('iroom_admin_fruit_draft',JSON.stringify(body));statusEl.textContent='서버 저장이 불가해 이 기기에 안전하게 임시저장했습니다.'}}
async function loadList(){let rows=[];try{const r=await fetch('/api/admin/fruits',{credentials:'same-origin'});if(r.ok)rows=await r.json()}catch(e){}document.querySelector('#fruitList tbody').innerHTML=(rows.items||rows||[]).map(x=>`<tr><td>${x.displayOrder||100}</td><td>${x.name||''}</td><td>${x.season||''}</td><td>${Number(x.salePrice||0).toLocaleString()}원</td><td>${x.stock||0}</td><td>${x.status||''}</td><td>${x.recommended?'추천 ':''}${x.best?'BEST ':''}${x.newItem?'NEW':''}</td></tr>`).join('')||'<tr><td colspan="7">등록된 맞춤과일이 없습니다.</td></tr>'}
form.addEventListener('submit',e=>{e.preventDefault();save(false)});document.querySelector('#draft').onclick=()=>save(true);document.querySelector('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/band-admin.html'};requireAdmin();
</script></body></html>
