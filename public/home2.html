<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이룸 fresh fruits</title>
<meta name="description" content="이룸 fresh fruits Home2 refined reference">
<meta name="theme-color" content="#f7f6ef">
<link rel="stylesheet" href="./iroom_assets/iroom-v60-45-home2-reference-fix.css?v=60.45">
<script>
(()=>{if('serviceWorker' in navigator && location.protocol !== 'file:')addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=60.45').catch(()=>{}),{once:true});})();
</script>
</head>
<body class="h245-body">
<div class="h245-site">
<header class="h245-header">
  <a class="h245-logo" href="/home2" aria-label="이룸 fresh fruits 홈"><img src="./iroom_assets/iroom-logo-user.png" alt="이룸 fresh fruits"></a>
  <nav class="h245-nav" aria-label="주요 메뉴">
    <button type="button" data-menu="fruit">과일</button>
    <button type="button" data-menu="gift">선물세트</button>
    <button type="button" data-menu="curation">과일 큐레이션</button>
    <button type="button" data-menu="routine">정기 루틴</button>
    <button type="button" data-menu="guide">과일 가이드</button>
    <button type="button" data-menu="brand">브랜드 스토리</button>
  </nav>
  <div class="h245-actions">
    <button type="button" data-utility="search" aria-label="검색"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.2"></circle><path d="M15.5 15.5 20 20"></path></svg></button>
    <button type="button" data-utility="login" aria-label="로그인"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.4" r="3.5"></circle><path d="M5.2 20c.8-4 3-6 6.8-6s6 2 6.8 6"></path></svg></button>
    <button type="button" data-utility="cart" aria-label="장바구니"><svg viewBox="0 0 24 24"><path d="M3 4h2.1l1.8 10.2h10.8L20 7H6"></path><circle cx="9" cy="18.7" r="1.1"></circle><circle cx="17" cy="18.7" r="1.1"></circle></svg><span data-cart-badge hidden>0</span></button>
  </div>
</header>

<div class="h245-dim" hidden></div>
<section class="h245-mega" hidden aria-label="상단 메뉴 패널">
  <button class="h245-mega-close" type="button" data-close-mega aria-label="메뉴 닫기">×</button>
  <aside class="h245-mega-side">
    <h2 data-panel-title>과일</h2>
    <div class="h245-side-list" data-panel-filters></div>
  </aside>
  <div class="h245-mega-main" data-panel-main></div>
</section>

<main>
  <section class="h245-hero">
    <div class="h245-hero-copy">
      <small>PREMIUM FRESH FRUITS</small>
      <h1>좋은 과일이<br>일상을 더 특별하게</h1>
      <p>가장 신선한 제철의 맛을<br>당신의 식탁으로 전합니다.</p>
      <button type="button" class="h245-primary" data-menu="fruit">지금, 이룸의 과일 보기 <span>→</span></button>
      <div class="h245-pager" aria-hidden="true"><i></i><b>01</b><span>02</span><span>03</span><span>‹</span><span>›</span></div>
    </div>
    <div class="h245-hero-art" aria-hidden="true"></div>
  </section>

  <section class="h245-feature">
    <div class="h245-feature-head">
      <div>
        <small>CURATED FRUITS</small>
        <h2>이룸 추천 과일</h2>
        <p>메인 아래에서도 바로 과일을 보고, 사진을 누르면 상세보기가 열리도록 정리했습니다.</p>
      </div>
      <button type="button" class="h245-link" data-menu="fruit">전체보기 →</button>
    </div>
    <div class="h245-product-grid" data-home-grid></div>
  </section>

  <section class="h245-gift">
    <div class="h245-feature-head">
      <div>
        <small>PREMIUM GIFT</small>
        <h2>선물세트 추천</h2>
        <p>과일세트도 별도 불편한 이동 없이 한 번에 보고 선택할 수 있게 구성했습니다.</p>
      </div>
      <button type="button" class="h245-link" data-menu="gift">선물세트 보기 →</button>
    </div>
    <div class="h245-gift-grid" data-home-gifts></div>
  </section>
</main>

<div class="h245-modal-backdrop" id="productModal" aria-hidden="true">
  <section class="h245-modal" role="dialog" aria-modal="true" aria-labelledby="productTitle">
    <button type="button" class="h245-modal-close" data-close-product aria-label="닫기">×</button>
    <div class="h245-modal-grid">
      <div class="h245-modal-visual"><img id="productImage" alt=""></div>
      <div class="h245-modal-copy">
        <small id="productKicker"></small>
        <h3 id="productTitle"></h3>
        <p id="productDesc"></p>
        <dl class="h245-specs">
          <div><dt>산지</dt><dd id="productOrigin"></dd></div>
          <div><dt>구성</dt><dd id="productPack"></dd></div>
          <div><dt>등급</dt><dd id="productGrade"></dd></div>
        </dl>
        <strong id="productPrice"></strong>
        <div class="h245-qty">
          <button type="button" data-qty="minus">−</button>
          <input id="productQty" type="number" min="1" value="1" inputmode="numeric" aria-label="수량">
          <button type="button" data-qty="plus">＋</button>
        </div>
        <div class="h245-modal-actions">
          <button type="button" class="h245-secondary" data-close-product>닫기</button>
          <button type="button" class="h245-primary" data-add-cart>장바구니 담기</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="h245-modal-backdrop" id="infoModal" aria-hidden="true">
  <section class="h245-modal h245-info" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <button type="button" class="h245-modal-close" data-close-info aria-label="닫기">×</button>
    <small id="infoKicker"></small>
    <h3 id="infoTitle"></h3>
    <p id="infoText"></p>
  </section>
</div>

<script defer src="./iroom_assets/iroom-v60-45-home2-reference-fix.js?v=60.45"></script>
</div>
</body>
</html>
