<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이룸 관리자</title><style>body{margin:0;background:#fbf7ee;color:#17382a;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:60px auto;padding:20px}.card{background:#fffdf9;border:1px solid #dfd2bd;border-radius:20px;padding:28px}.top{display:flex;gap:12px;align-items:center}.top a{color:#073b2c;text-decoration:none;font-weight:800}.top h1{flex:1}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #d8cdbd;margin-top:10px}button{background:#073b2c;color:#fff;font-weight:900}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.menu a{padding:24px;border:1px solid #dfd2bd;border-radius:14px;text-decoration:none;color:#17382a;background:#fff}.hidden{display:none}@media(max-width:560px){.menu{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="/">← 홈페이지</a><h1>관리자 설정</h1></div><section id="login" class="card"><h2>관리자 로그인</h2><p>한 번 로그인하면 맞춤과일 관리에서 다시 로그인하지 않습니다.</p><input id="password" type="password" placeholder="관리자 비밀번호"><button id="doLogin">로그인</button><p id="msg"></p></section><section id="dashboard" class="card hidden"><h2>관리 메뉴</h2><p>현재 관리자 인증 세션으로 연결되었습니다.</p><div class="menu"><a href="/admin-fruits.html"><b>맞춤과일 관리</b><br><small>상세 등록·업로드·노출 설정</small></a><a href="/admin-fruits.html"><b>과일 관리</b><br><small>재고·가격·판매 상태</small></a></div><button id="logout">로그아웃</button></section></main><script>
const login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),msg=document.querySelector('#msg'),next=new URLSearchParams(location.search).get('next');
async function check(){try{const r=await fetch('/api/admin/session',{credentials:'same-origin'});if(r.ok){if(next){location.href=next;return}login.classList.add('hidden');dash.classList.remove('hidden')}else{login.classList.remove('hidden');dash.classList.add('hidden')}}catch(e){msg.textContent='홈페이지 서버가 실행되지 않았습니다. 폴더의 “이룸_관리자_실행.cmd”를 먼저 실행해주세요.'}}
document.querySelector('#doLogin').onclick=async()=>{msg.textContent='로그인 확인 중…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:document.querySelector('#password').value})});if(r.ok){location.href=next||'/band-admin.html'}else if(r.status===503)msg.textContent='관리자 비밀번호가 설정되지 않았습니다. 실행 파일을 다시 시작해주세요.';else msg.textContent='비밀번호를 확인해주세요.'}catch(e){msg.textContent='서버에 연결할 수 없습니다. “이룸_관리자_실행.cmd”를 먼저 실행해주세요.'}};
document.querySelector('#logout').onclick=async()=>{try{await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'})}finally{login.classList.remove('hidden');dash.classList.add('hidden');document.querySelector('#password').value='';msg.textContent='로그아웃되었습니다. 다시 이용하려면 로그인하세요.'}};check();
</script></body></html>
