function giftObj(i){return {id:'gift-'+season+'-'+i,name:GIFT_NAMES[i],price:GIFT_PRICES[i],image:`giftcard-${season}-${i}.webp`,desc:['가장 맛있는 과일을 다양하게 고른 대표 구성입니다.','사과와 배를 균형 있게 담은 정갈한 구성입니다.','계절 대표 과일을 선별해 고급스럽게 담았습니다.','가족이 함께 나누기 좋은 넉넉한 구성입니다.','부담 없이 마음을 전하기 좋은 실속 구성입니다.','수량과 예산에 맞춰 제안하는 기업·단체 구성입니다.'][i]}}
function giftCard(g,i){return `<article class="giftCard"><button class="giftArt paint ${['peach','butter','sage'][i%3]}" data-gift-open="${i}"><img src="${A+g.image}?v=${BUILD}" alt="${g.name}"></button><div class="giftBody"><span class="eyebrow">${i===5?'BUSINESS GIFT':'IROOM GIFT'}</span><h3>${g.name}</h3><p>${g.desc}</p><div class="cardPriceRow"><strong>${fmt(g.price)}~</strong><button class="linkBtn" data-gift-open="${i}">상세보기 →</button></div><div class="cardActions"><button class="btn soft" data-gift-add="${i}">장바구니</button><button class="btn primary" data-gift-buy="${i}">BUY</button></div></div></article>`}
function giftsHTML(){const gs=GIFT_NAMES.map((_,i)=>giftObj(i));return `<div class="page"><div class="pageInner"><section class="pageHero paint peach"><div><span class="eyebrow">PREMIUM GIFTS</span><h1>선물세트</h1><p>예산별로 비교하고, 구성과 가격을 확인한 뒤 바로 주문할 수 있습니다.</p></div><span class="pagePill">6 GIFT SELECTIONS</span></section>

function curationHTML(){const ps=allProducts();return `<div class="page"><div class="pageInner"><section class="pageHero paint sage"><div><span class="eyebrow">IROOM CURATION</span><h1>과일 큐레이션</h1><p>상황을 고르면 추천 과일과 가격이 바로 보이고, 구성 전체를 한 번에 담을 수 있습니다.</p></div><span class="pagePill">6 CURATIONS</span></section>

function picnicHTML(){const ps=allProducts(), sets=[[0,2,3],[1,4,5],[0,1,2,6]];return `<div class="page"><div class="pageInner"><section class="pageHero paint butter"><div><span class="eyebrow">IROOM ROUTINE</span><h1>피크닉 루틴</h1><p>풍경 대신 ‘무엇을 가져갈지’에 집중했습니다. 세 가지 간단한 구성을 바로 주문할 수 있습니다.</p></div><span class="pagePill">3 SIMPLE SETS</span></section>

function storyHTML(){return `<div class="page"><div class="pageInner"><section class="pageHero paint peach"><div><span class="eyebrow">IROOM STORY</span><h1>이룸의 이야기</h1><p>화려한 풍경보다 좋은 과일을 잘 고르고, 이해하기 쉽게 보여주는 일을 중요하게 생각합니다.</p></div><span class="pagePill">GOOD FRUITS, EASY CHOICE</span></section>

<article class="storyDetail paint sage"><span class="eyebrow">HOW WE SHOW</span><h2>보기 쉽게, 비교하기 쉽게.</h2><p>상품 목록에서 바로 가격을 보고, 상세에서는 구성과 배송 안내를 확인하고, 장바구니와 BUY NOW로 바로 이어집니다. 브랜드 감성은 페인팅 질감으로 유지하고 쇼핑 흐름은 단순하게 만듭니다.</p><div class="principles"><div class="principle"><b>A</b><strong>상품 우선</strong><span>메인부터 NEW & BEST를 먼저 보여줍니다.</span></div><div class="principle"><b>B</b><strong>상세 정보</strong><span>산지·중량·가격·배송을 한 화면에.</span></div><div class="principle"><b>C</b><strong>구매 연결</strong><span>담기와 바로구매를 모든 상품에 연결합니다.</span></div></div></article></div></div></div>${footerHTML()}`}

<div class="detailVisual paint ${['peach','sage','butter'][Math.abs(p.name.length)%3]}"><img src="${img(p)}" alt="${p.name}"></div>

<div class="detailTabs"><article class="detailTab paint"><span class="eyebrow">PRODUCT</span><h3>상품 안내</h3><p>사진, 산지, 구성, 가격을 한 화면에서 확인할 수 있도록 정리했습니다. 입고 상태에 따라 실제 크기와 색감에는 자연스러운 차이가 있을 수 있습니다.</p></article><article class="detailTab paint sage"><span class="eyebrow">STORAGE</span><h3>보관 가이드</h3><p>수령 후 상태를 확인하고 과일별 적정 온도와 후숙 여부에 맞춰 보관하세요. 장기 보관보다 가장 맛있는 시기에 드시는 것을 권합니다.</p></article><article class="detailTab paint butter"><span class="eyebrow">DELIVERY</span><h3>배송 안내</h3><p>신선식품 특성상 배송 중 자연스러운 흔들림이 있을 수 있습니다. 실제 배송 정책과 교환 기준은 기존 이룸 운영정책과 연결합니다.</p></article></div>
<section class="relatedSection"><div class="sectionHead"><div><span class="eyebrow">YOU MAY ALSO LIKE</span><h2>함께 보기 좋은 과일</h2></div></div><div class="productGrid">${related.map(cardProduct).join('')}</div></section></div>${footerHTML()}`}

function checkoutHTML(){const items=checkoutItems.length?checkoutItems:cart.slice();return `<div class="utilityPage" style="max-width:1250px"><section class="utilityBox paint"><span class="eyebrow">CHECKOUT</span><h1>주문서</h1><p class="muted">상품과 배송 정보를 확인하세요. 실제 결제/서버 저장은 기존 백엔드 연결 단계에서 활성화합니다.</p><div class="checkoutGrid"><form class="checkoutForm" id="checkoutForm"><input required name="name" placeholder="받는 분 이름"><input required name="phone" placeholder="연락처"><input class="wide" required name="address" placeholder="배송지 주소"><select name="pay"><option>카드 결제</option><option>무통장 입금</option></select><input name="memo" placeholder="배송 메모"><textarea class="wide" name="note" placeholder="선물 메시지 또는 요청사항"></textarea><button class="btn primary" type="submit">주문 내용 확인</button></form><aside class="orderSummary"><span class="eyebrow">ORDER SUMMARY</span><div>${items.map(orderLine).join('')}</div><div class="orderTotal"><span>주문 예정 금액</span><strong>${fmt(items.reduce((s,x)=>s+entityPrice(x)*x.qty,0))}</strong></div></aside></div></section></div>${footerHTML()}`}

function footerHTML(){return `<footer class="footer"><div class="footerInner"><div><img src="./assets/home2-v79/logo-small.png?v=6081" alt=""><p>좋은 과일을 보기 쉽게, 고르기 쉽게.<br>이룸 fresh fruits</p></div><div><h4>SHOP</h4><p><button data-route="fruits">과일</button><button data-route="gifts">선물세트</button><button data-route="curation">큐레이션</button></p></div><div><h4>INFO</h4><p><button data-route="guide">과일 가이드</button><button data-route="story">이룸 이야기</button><button data-route="account">MY IROOM</button></p></div></div></footer>`}

function giftDetail(i){const g=giftObj(i), ps=allProducts(), picks=MAPS[Math.min(i,MAPS.length-1)].map(j=>ps[j%ps.length]);return `<div class="detailPage"><div class="breadcrumb"><button class="linkBtn" data-back>← 선물세트</button> · ${g.name}</div><section class="detailTop"><div class="detailVisual paint peach"><img src="${A+g.image}?v=${BUILD}" alt="${g.name}"></div><div class="detailInfo"><span class="eyebrow">IROOM GIFT</span><h1>${g.name}</h1><p class="detailIntro">${g.desc}</p><div class="detailPrice">${fmt(g.price)}~</div><div class="infoRows"><div class="infoRow"><span>추천 구성</span><b>${picks.map(p=>p.name).join(' · ')}</b></div><div class="infoRow"><span>포장</span><b>이룸 선물 포장</b></div><div class="infoRow"><span>배송</span><b>신선식품 선물 배송</b></div></div><div class="qtyRow"><div class="qty"><button data-gqty="-1">−</button><input id="giftQty" value="1"><button data-gqty="1">＋</button></div><div class="qtyTotal"><span>상품 합계</span><strong id="giftTotal">${fmt(g.price)}</strong></div></div><div class="detailActions"><button class="btn" data-gift-detail-add="${i}">장바구니 담기</button><button class="btn primary" data-gift-detail-buy="${i}">BUY NOW</button></div></div></section></div>${footerHTML()}`}

function bindRouteExtras(){
 if(route==='home'){const hv=$('#heroVisual');if(hv)hv.addEventListener('pointermove',e=>{const r=hv.getBoundingClientRect();hv.style.setProperty('--hx',((e.clientX-r.left)/r.width*100)+'%');hv.style.setProperty('--hy',((e.clientY-r.top)/r.height*100)+'%')})}
 if(route==='fruits'){filterProducts();$('#shopSearch')?.addEventListener('input',filterProducts);$('#shopSort')?.addEventListener('change',filterProducts);$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{$$('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterProducts()}))}
 if(route==='gifts'){$$('[data-gift-filter]').forEach(b=>b.addEventListener('click',()=>{$$('[data-gift-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterGifts()}));$('#giftSort')?.addEventListener('change',filterGifts)}
 if(route==='search'){renderSearch('');$('#globalSearch')?.addEventListener('input',e=>renderSearch(e.target.value.trim()));$('#searchGo')?.addEventListener('click',()=>renderSearch($('#globalSearch').value.trim()))}
}
function filterProducts(){let arr=allProducts().slice(), f=$('[data-filter].on')?.dataset.filter||'all', q=($('#shopSearch')?.value||'').trim(), sort=$('#shopSort')?.value||'default';if(f==='under35')arr=arr.filter(p=>pprice(p)<=35000);if(f==='over36')arr=arr.filter(p=>pprice(p)>=36000);if(f==='giftfit')arr=arr.filter(p=>pprice(p)>=34000);if(q)arr=arr.filter(p=>p.name.includes(q)||p.origin.includes(q));if(sort==='low')arr.sort((a,b)=>pprice(a)-pprice(b));if(sort==='high')arr.sort((a,b)=>pprice(b)-pprice(a));if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ko'));$('#shopCount').textContent=arr.length+' products';$('#shopGrid').innerHTML=arr.map(cardProduct).join('')}
function filterGifts(){let arr=GIFT_NAMES.map((_,i)=>giftObj(i)), f=$('[data-gift-filter].on')?.dataset.giftFilter||'all', sort=$('#giftSort')?.value||'default';if(f==='under100')arr=arr.filter(g=>g.price<100000);if(f==='business')arr=arr.filter(g=>g.id.endsWith('-5'));if(sort==='low')arr.sort((a,b)=>a.price-b.price);if(sort==='high')arr.sort((a,b)=>b.price-a.price);$('#giftGrid').innerHTML=arr.map((g)=>giftCard(g,Number(g.id.split('-').pop()))).join('')}
function renderSearch(q){const arr=Object.values(SEASONS).flatMap(s=>[...s.products,...(s.extra||[])]).filter(p=>!q||p.name.includes(q)||p.origin.includes(q)).slice(0,12);$('#searchResults').innerHTML=arr.length?arr.map(cardProduct).join(''):'<p class="muted">검색 결과가 없습니다.</p>'}
function observeReveals(){if(!('IntersectionObserver'in window)){$$('.reveal').forEach(x=>x.classList.add('in'));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});$$('.reveal').forEach(x=>io.observe(x))}
function loadCart(){try{cart=JSON.parse(get('iroom-v81-cart')||get('iroom-v80-cart')||'[]');if(!Array.isArray(cart))cart=[]}catch(_){cart=[]}saveCart()}
function saveCart(){set('iroom-v81-cart',JSON.stringify(cart));renderCartBadge();if(!$('#cartDrawer').hidden)renderCart()}
function renderCartBadge(){const n=cart.reduce((s,x)=>s+x.qty,0),b=$('#cartBadge');b.textContent=n;b.hidden=!n}
function addProduct(id,qty=1){const x=cart.find(v=>v.kind==='product'&&v.id===id);if(x)x.qty+=qty;else cart.push({kind:'product',id,qty});saveCart();toast((findProduct(id)?.name||'상품')+'을 장바구니에 담았습니다.')}
function addGift(i,qty=1){const id='gift-'+season+'-'+i,x=cart.find(v=>v.kind==='gift'&&v.id===id);if(x)x.qty+=qty;else cart.push({kind:'gift',id,qty});saveCart();toast(GIFT_NAMES[i]+'을 장바구니에 담았습니다.')}
function entity(x){if(x.kind==='gift'){const i=Number(x.id.split('-').pop());return {...giftObj(i),kind:'gift'}}const p=findProduct(x.id);return p?{...p,kind:'product',image:p.detail,priceN:pprice(p)}:null}
function entityPrice(x){const e=entity(x);return e?(e.kind==='gift'?e.price:pprice(e)):0}
function orderLine(x){const e=entity(x);if(!e)return'';const image=e.kind==='gift'?e.image:e.detail;return `<div class="orderLine"><img src="${A+image}?v=${BUILD}" alt="${e.name}"><span><b>${e.name}</b><small>${x.qty}개 · ${e.kind==='gift'?'선물세트':e.origin}</small></span><strong>${fmt(entityPrice(x)*x.qty)}</strong></div>`}
function renderCart(){const body=$('#cartBody');if(!cart.length){body.innerHTML='<p class="muted" style="padding:25px 6px">장바구니가 비어 있습니다.</p>';$('#cartTotal').textContent='0원';return}body.innerHTML=cart.map((x,i)=>{const e=entity(x);if(!e)return'';const image=e.kind==='gift'?e.image:e.detail;return `<div class="cartLine"><img src="${A+image}?v=${BUILD}" alt="${e.name}"><div><h4>${e.name}</h4><small>${fmt(entityPrice(x))}</small><div class="cartQty"><button data-cart-qty="${i}:-1">−</button><b>${x.qty}</b><button data-cart-qty="${i}:1">＋</button></div></div><button class="remove" data-remove="${i}">삭제</button></div>`}).join('');$('#cartTotal').textContent=fmt(cart.reduce((s,x)=>s+entityPrice(x)*x.qty,0))}
function openCart(){renderCart();$('#cartScrim').hidden=false;$('#cartDrawer').hidden=false;document.body.classList.add('lock')}
function closeCart(){$('#cartScrim').hidden=true;$('#cartDrawer').hidden=true;document.body.classList.remove('lock')}
function toast(t){const x=$('#toast');x.textContent=t;x.hidden=false;clearTimeout(timer);timer=setTimeout(()=>x.hidden=true,1700)}
function buyItems(items){checkoutItems=items;go('checkout',{checkout:items})}
function detailQty(){return Math.max(1,parseInt($('#detailQty')?.value||'1',10)||1)}
function giftQty(){return Math.max(1,parseInt($('#giftQty')?.value||'1',10)||1)}
function updateDetailTotal(){if(route==='product'&&currentProduct)$('#detailTotal').textContent=fmt(pprice(currentProduct)*detailQty())}
function updateGiftTotal(i){$('#giftTotal').textContent=fmt(GIFT_PRICES[i]*giftQty())}
function openGift(i){currentProduct=null;route='gift-detail';history.pushState({r:'gift-detail',i},'','#gift-'+i);$('#app').innerHTML=giftDetail(i);headerActive();window.scrollTo({top:0,behavior:'instant'});$('#app').dataset.gift=i}
function backSmart(){if(history.length>1)history.back();else go('home')}
document.addEventListener('click',e=>{
 const r=e.target.closest('[data-route]');if(r){go(r.dataset.route);return}
 if(e.target.closest('[data-cart]')){openCart();return}if(e.target.closest('[data-cart-close]')||e.target.id==='cartScrim'){closeCart();return}
 const p=e.target.closest('[data-product]');if(p){currentProduct=findProduct(p.dataset.product);go('product',{product:currentProduct});return}
 const add=e.target.closest('[data-add]');if(add){addProduct(add.dataset.add);return}
 const buy=e.target.closest('[data-buy]');if(buy){buyItems([{kind:'product',id:buy.dataset.buy,qty:1}]);return}
 const gift=e.target.closest('[data-gift-open]');if(gift){openGift(Number(gift.dataset.giftOpen));return}
 const ga=e.target.closest('[data-gift-add]');if(ga){addGift(Number(ga.dataset.giftAdd));return}
 const gb=e.target.closest('[data-gift-buy]');if(gb){const i=Number(gb.dataset.giftBuy);buyItems([{kind:'gift',id:'gift-'+season+'-'+i,qty:1}]);return}
 const cur=e.target.closest('[data-curation]');if(cur){go('curation');return}
 const ca=e.target.closest('[data-curation-add]');if(ca){MAPS[Number(ca.dataset.curationAdd)].forEach(j=>addProduct(allProducts()[j%allProducts().length].id));return}
 const cb=e.target.closest('[data-curation-buy]');if(cb){const items=MAPS[Number(cb.dataset.curationBuy)].map(j=>({kind:'product',id:allProducts()[j%allProducts().length].id,qty:1}));buyItems(items);return}
 const sa=e.target.closest('[data-set-add]');if(sa){sa.dataset.setAdd.split(',').map(Number).forEach(j=>addProduct(allProducts()[j%allProducts().length].id));return}
 const sb=e.target.closest('[data-set-buy]');if(sb){const items=sb.dataset.setBuy.split(',').map(Number).map(j=>({kind:'product',id:allProducts()[j%allProducts().length].id,qty:1}));buyItems(items);return}
 const dq=e.target.closest('[data-qty]');if(dq){$('#detailQty').value=Math.max(1,detailQty()+Number(dq.dataset.qty));updateDetailTotal();return}
 const da=e.target.closest('[data-detail-add]');if(da){addProduct(da.dataset.detailAdd,detailQty());return}
 const db=e.target.closest('[data-detail-buy]');if(db){buyItems([{kind:'product',id:db.dataset.detailBuy,qty:detailQty()}]);return}
 const gq=e.target.closest('[data-gqty]');if(gq){const i=Number($('#app').dataset.gift);$('#giftQty').value=Math.max(1,giftQty()+Number(gq.dataset.gqty));updateGiftTotal(i);return}
 const gda=e.target.closest('[data-gift-detail-add]');if(gda){addGift(Number(gda.dataset.giftDetailAdd),giftQty());return}
 const gdb=e.target.closest('[data-gift-detail-buy]');if(gdb){const i=Number(gdb.dataset.giftDetailBuy);buyItems([{kind:'gift',id:'gift-'+season+'-'+i,qty:giftQty()}]);return}
 const cq=e.target.closest('[data-cart-qty]');if(cq){const [i,d]=cq.dataset.cartQty.split(':').map(Number);cart[i].qty=Math.max(1,cart[i].qty+d);saveCart();return}
 const rm=e.target.closest('[data-remove]');if(rm){cart.splice(Number(rm.dataset.remove),1);saveCart();return}
 if(e.target.closest('[data-checkout]')){if(cart.length){closeCart();buyItems(cart.slice())}else toast('장바구니가 비어 있습니다.');return}
 if(e.target.closest('[data-back]')){backSmart();return}
 const ss=e.target.closest('[data-season]');if(ss){season=ss.dataset.season;set('iroom-v81-preview-season',season);render();toast(SEASONS[season].label+' 상품으로 미리보기 전환했습니다.');return}
 if(e.target.closest('[data-demo-login]')){toast('로그인은 백엔드 연결 단계에서 활성화됩니다.');return}
 if(e.target.closest('[data-demo-order]')){toast('주문 조회는 주문 DB 연결 단계에서 활성화됩니다.');return}
})
document.addEventListener('input',e=>{if(e.target.id==='detailQty')updateDetailTotal();if(e.target.id==='giftQty')updateGiftTotal(Number($('#app').dataset.gift))})
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm'){e.preventDefault();toast('주문 정보 확인 완료 · 실제 결제 연결 전 단계입니다.')}})
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#cartDrawer').hidden){closeCart();return}if(route!=='home')backSmart()}})
window.addEventListener('popstate',()=>{const h=location.hash.replace('#','');if(h.startsWith('product-')){currentProduct=findProduct(h.replace('product-',''));route='product'}else if(h.startsWith('gift-')){route='gifts'}else route=['home','fruits','gifts','curation','picnic','guide','story','search','account','checkout'].includes(h)?h:'home';render()})
const savedSeason=get('iroom-v81-preview-season');if(keys.includes(savedSeason))season=savedSeason;
loadCart();render();
})();
</script>
</body>
</html>
