<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이룸 과일박스 관리자</title><style>
:root{--g:#082f24;--gold:#b88a32;--bg:#f7f4ed;--line:#e2d6c3}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:var(--bg);color:#173027}.top{background:var(--g);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:20px}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.login{max-width:440px;margin:80px auto}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #d8ccba;border-radius:9px;padding:10px;background:#fff}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}.primary{background:var(--g);color:#fff}.gold{background:#f0dfb9;color:#5a4216}.danger{background:#fff0ed;color:#a23b2f}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;background:#fff;border:1px solid var(--line)}.tabs button.on{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.item img{width:100%;height:150px;object-fit:cover;background:#eee}.body{padding:13px}.name{font-weight:900;font-size:17px}.meta{font-size:12px;color:#756b5c;margin:5px 0}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.badge{font-size:11px;border-radius:999px;padding:4px 7px;background:#eee}.badge.ok{background:#e3f3ea;color:#17623f}.badge.off{background:#f5dfdc;color:#92362c}.actions{display:flex;gap:6px}.actions button{flex:1}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.on{display:flex}.box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.preview{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}@media(max-width:650px){.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div class="top"><b>🍎 이룸 과일박스 관리자</b><span>고객 선택상품 관리</span></div><main class="wrap"><section id="login" class="card login"><h2>관리자 로그인</h2><p>Render의 ADMIN_PASSWORD로 로그인합니다.</p><div class="row"><input id="pw" type="password" placeholder="관리자 비밀번호" style="flex:1"><button class="primary" id="loginBtn">로그인</button></div><p id="loginMsg"></p></section><section id="app" hidden><div class="card"><div class="toolbar"><input id="search" placeholder="과일명·산지 검색"><button class="primary" id="addBtn">＋ 과일 추가</button><button id="reloadBtn">새로고침</button></div><div class="tabs" id="tabs"></div><small>추천 상품은 고객 화면에 먼저 보입니다. 품절은 선택 불가, 숨김은 고객 화면에서 완전히 제외됩니다.</small></div><div class="grid" id="grid"></div></section></main>
<div class="modal" id="modal"><div class="box"><div class="row" style="justify-content:space-between"><h2 id="formTitle">과일 추가</h2><button id="closeBtn">✕</button></div><div class="formgrid"><input type="hidden" id="id"><div class="field"><label>과일명 *</label><input id="name"></div><div class="field"><label>산지</label><input id="origin"></div><div class="field"><label>카테고리</label><select id="category"><option>사과·배</option><option>포도</option><option>감귤류</option><option>복숭아·자두</option><option>멜론·수박</option><option>망고·열대과일</option><option>기타</option></select></div><div class="field"><label>선택 단위</label><select id="unit"><option>개</option><option>송이</option><option>팩</option><option>박스</option></select></div><div class="field"><label>표시 문구</label><input id="boxUnit" placeholder="낱개 / 1송이"></div><div class="field"><label>맛·특징</label><input id="taste" placeholder="아삭·달콤"></div><div class="field"><label>재고 (0=품절)</label><input id="stock" type="number" min="0" value="99"></div><div class="field"><label>표시 순서</label><input id="sortOrder" type="number" value="100"></div><div class="field wide"><label>이미지</label><div class="row"><input id="image" placeholder="/assets/... 또는 업로드" style="flex:1"><input id="imageFile" type="file" accept="image/*"><img id="preview" class="preview"></div></div><div class="field"><label><input id="featured" type="checkbox"> 추천 상품</label></div><div class="field"><label><input id="visible" type="checkbox" checked> 고객에게 노출</label></div><div class="field wide"><label>설명</label><textarea id="desc" rows="3"></textarea></div></div><div class="row" style="margin-top:16px;justify-content:flex-end"><button id="deleteBtn" class="danger" hidden>삭제</button><button id="saveBtn" class="primary">저장</button></div><p id="formMsg"></p></div></div>
<script>
let token=localStorage.getItem('iroom_admin_token')||'',products=[],cat='전체';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청 실패');return d}async function login(){try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});token=d.token;localStorage.setItem('iroom_admin_token',token);showApp()}catch(e){$('#loginMsg').textContent=e.message}}async function showApp(){try{$('#login').hidden=true;$('#app').hidden=false;await load()}catch(e){token='';localStorage.removeItem('iroom_admin_token');$('#login').hidden=false;$('#app').hidden=true;$('#loginMsg').textContent='다시 로그인해주세요.'}}async function load(){const d=await api('/api/admin/all');products=d.products||[];render()}function n(p){return {...p,fruitCategory:p.fruitCategory||p.category||'기타',boxSelectable:p.boxSelectable===true,featured:p.boxFeatured===true||p.featured===true,visible:p.active!==false}}function render(){const all=products.map(n),cats=['전체',...new Set(all.filter(x=>x.boxSelectable).map(x=>x.fruitCategory))];$('#tabs').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');const s=$('#search').value.trim().toLowerCase();const list=all.filter(p=>p.boxSelectable&&(cat==='전체'||p.fruitCategory===cat)&&(!s||`${p.name} ${p.origin}`.toLowerCase().includes(s))).sort((a,b)=>(b.featured-a.featured)||(Number(a.boxSortOrder||999)-Number(b.boxSortOrder||999)));$('#grid').innerHTML=list.map(p=>`<article class="item"><img src="${esc(p.image||'/assets/prod-apple.jpg')}"><div class="body"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.origin||'산지 미입력')} · ${esc(p.fruitCategory)} · ${esc(p.boxUnitName||p.unit||'개')}</div><div class="badges"><span class="badge ${p.visible?'ok':'off'}">${p.visible?'노출':'숨김'}</span>${p.featured?'<span class="badge ok">추천</span>':''}<span class="badge ${Number(p.stock)>0?'ok':'off'}">${Number(p.stock)>0?'판매중':'품절'}</span></div><div class="actions"><button class="gold" data-edit="${esc(p.id)}">수정</button><button data-stock="${esc(p.id)}">${Number(p.stock)>0?'품절처리':'판매재개'}</button></div></div></article>`).join('')||'<div class="card">등록된 과일이 없습니다. “과일 추가”를 눌러주세요.</div>'}function openForm(p={}){p=n(p);$('#id').value=p.id||'';$('#name').value=p.name||'';$('#origin').value=p.origin||'';$('#category').value=p.fruitCategory||'기타';$('#unit').value=p.boxUnitName||p.unit||'개';$('#boxUnit').value=p.boxUnit||'';$('#taste').value=p.taste||'';$('#stock').value=p.stock??99;$('#sortOrder').value=p.boxSortOrder??100;$('#image').value=p.image||'';$('#preview').src=p.image||'';$('#featured').checked=!!p.featured;$('#visible').checked=p.visible!==false;$('#desc').value=p.description||'';$('#deleteBtn').hidden=!p.id;$('#formTitle').textContent=p.id?'과일 수정':'과일 추가';$('#formMsg').textContent='';$('#modal').classList.add('on')}async function uploadImage(){const f=$('#imageFile').files[0];if(!f)return $('#image').value;const data=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});const d=await api('/api/admin/upload',{method:'POST',body:JSON.stringify({dataUrl:data,name:f.name})});return d.url}async function save(){try{$('#formMsg').textContent='저장 중...';const image=await uploadImage();const body={name:$('#name').value.trim(),origin:$('#origin').value.trim(),category:$('#category').value,fruitCategory:$('#category').value,boxUnitName:$('#unit').value,unit:$('#unit').value,boxUnit:$('#boxUnit').value.trim()||($('#unit').value==='송이'?'1송이':'낱개'),taste:$('#taste').value.trim(),stock:Number($('#stock').value||0),boxSortOrder:Number($('#sortOrder').value||100),image,boxFeatured:$('#featured').checked,featured:$('#featured').checked,boxSelectable:true,active:$('#visible').checked,description:$('#desc').value.trim()};if(!body.name)throw Error('과일명을 입력하세요.');const id=$('#id').value;await api(id?'/api/admin/products/'+encodeURIComponent(id):'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(body)});$('#modal').classList.remove('on');await load()}catch(e){$('#formMsg').textContent=e.message}}async function toggleStock(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;await api('/api/admin/products/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({stock:Number(p.stock)>0?0:99})});await load()}async function del(){const id=$('#id').value;if(!id||!confirm('정말 삭제할까요? 숨김 처리가 더 안전합니다.'))return;await api('/api/admin/products/'+encodeURIComponent(id),{method:'DELETE'});$('#modal').classList.remove('on');await load()}$('#loginBtn').onclick=login;$('#pw').onkeydown=e=>{if(e.key==='Enter')login()};$('#addBtn').onclick=()=>openForm();$('#reloadBtn').onclick=load;$('#search').oninput=render;$('#closeBtn').onclick=()=>$('#modal').classList.remove('on');$('#saveBtn').onclick=save;$('#deleteBtn').onclick=del;$('#image').oninput=()=>$('#preview').src=$('#image').value;document.addEventListener('click',e=>{const t=e.target.closest('[data-cat]');if(t){cat=t.dataset.cat;render()}const ed=e.target.closest('[data-edit]');if(ed)openForm(products.find(x=>String(x.id)===ed.dataset.edit)||{});const st=e.target.closest('[data-stock]');if(st)toggleStock(st.dataset.stock)});if(token)showApp();
</script></body></html>
