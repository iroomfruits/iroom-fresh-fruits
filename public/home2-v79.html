const money=s=>Number(String(s).replace(/[^0-9]/g,''))||0;
function lock(){document.body.classList.toggle('lock',!$('#menuScreen').hidden||!$('#productOverlay').hidden||!$('#contentOverlay').hidden||!$('#simpleOverlay').hidden)}
function setSeason(s){if(s==='auto'){mode='auto';season=detect();set('iroom-v79-season','auto')}else{mode='manual';season=s;set('iroom-v79-season',s)}$('#mainImg').src=A+'page-'+season+'.webp?v='+BUILD;if(!$('#menuScreen').hidden&&menuType)showMenu(menuType);syncSeason()}
function syncSeason(){$('[data-season="auto"]')?.classList.toggle('on',mode==='auto');$$('[data-season]').forEach(b=>{if(b.dataset.season!=='auto')b.classList.toggle('on',mode==='manual'&&b.dataset.season===season)})}
function showMenu(type){menuType=type;$('#menuImg').src=A+'menu-'+type+'-'+season+'.webp?v='+BUILD;$('#menuImg').alt=SEASONS[season].label+' '+type;$('#fruitHits').hidden=type!=='fruit';$('#content6').hidden=!['gift','curation'].includes(type);$('#picnic3').hidden=type!=='picnic';$('#guide3').hidden=type!=='guide';$('#story2').hidden=type!=='story';
 const count=menuProducts(season).length;$$('#fruitHits [data-product-slot]').forEach((b,i)=>b.hidden=i>=count);$('#menuScreen').hidden=false;lock()}
function closeMenu(){if(!$('#productOverlay').hidden||!$('#contentOverlay').hidden||!$('#simpleOverlay').hidden)return;$('#menuScreen').hidden=true;menuType='';lock()}
function openProduct(p){if(!p)return;current=p;$('#detailImg').src=A+p.detail+'?v='+BUILD;$('#detailImg').alt=p.name;$('#detailTitle').textContent=p.name;$('#detailKick').textContent=(SEASONS[p.season||season].label+' SEASON').toUpperCase();$('#detailText').textContent='이룸이 제철의 맛과 선도, 산지의 상태를 기준으로 엄선한 '+p.name+'입니다.';$('#detailOrigin').textContent='산지 · '+p.origin;$('#detailPack').textContent='구성 · '+p.pack;$('#detailPrice').textContent=p.price;$('#qty').value='1';$('#productOverlay').hidden=false;lock()}
const CONTENT={
 gift:[['프리미엄 제철 과일 선물세트','제철에 가장 맛있는 과일을 골라 정갈하게 구성한 이룸의 대표 선물입니다.'],['클래식 과일 선물세트','익숙하고 좋은 과일을 균형 있게 담은 기본 선물 구성입니다.'],['계절 정성 선물','계절의 대표 과일을 중심으로 마음을 담아 구성합니다.'],['제철 과일 선물세트','그 계절에 맛이 오른 과일을 중심으로 균형 있게 구성합니다.'],['가족 과일 선물세트','온 가족이 편하게 나눠 먹기 좋은 넉넉한 구성입니다.'],['기업 · 단체 선물','수량과 예산에 맞춰 품목·포장·배송까지 제안합니다.']],
 curation:[['달콤한 풍미','당도와 풍미를 중심으로 한 번에 즐기기 좋은 과일 조합입니다.'],['아이 간식','먹기 편하고 부드러운 과일을 중심으로 구성합니다.'],['상큼한 과일','가볍고 산뜻한 풍미가 필요한 순간에 어울리는 구성입니다.'],['가볍게 즐기는 아침','바쁜 아침에도 부담 없이 즐기기 좋은 제철 과일 구성입니다.'],['가족과 함께','여러 사람이 함께 즐기기 좋은 식감과 풍미를 고르게 담았습니다.'],['이룸 상위 선별','모양·당도·선도까지 한 단계 더 엄격하게 고른 구성입니다.']],
 picnic:[['가볍게 준비하는 피크닉','좋은 과일 몇 가지와 바구니, 천 한 장으로 시작하는 가벼운 피크닉입니다.'],['주말 한 접시','제철 과일로 채우는 여유로운 주말의 한 접시를 제안합니다.'],['피크닉 선물 구성','소중한 사람에게 전하는 계절의 맛과 마음을 담았습니다.']],
 guide:[['좋은 과일 고르는 법','색과 향, 단단함, 꼭지와 표면 상태를 기준으로 좋은 과일을 고르는 기본 방법입니다.'],['오래 보관하는 법','과일별 적정 온도와 후숙 여부를 구분해 보관하면 맛을 더 오래 유지할 수 있습니다.'],['더 맛있게 먹는 법','손질 순서와 먹기 좋은 온도, 타이밍을 맞추면 향과 당도를 더 잘 느낄 수 있습니다.']],
 story:[['보기 쉽게, 고르기 쉽게.','좋은 과일을 고르는 일이 어렵지 않도록 계절의 맛과 기준을 정리해 제안합니다.'],['좋은 과일이 일상을 밝힙니다.','산지의 신선함, 엄선한 품질, 제철의 맛을 기준으로 이룸의 과일을 고릅니다.']]
};
function contentImage(type,i){if(type==='gift')return A+`giftcard-${season}-${Math.min(i,5)}.webp?v=${BUILD}`;if(type==='picnic')return A+(i===2?'gift-':'picnic-')+season+'.webp?v='+BUILD;if(type==='story')return A+(i===0?'brand-':'hero-')+season+'.webp?v='+BUILD;if(type==='guide')return A+SEASONS[season].products[Math.min(i,SEASONS[season].products.length-1)].detail+'?v='+BUILD;return A+SEASONS[season].products[Math.min(i,SEASONS[season].products.length-1)].detail+'?v='+BUILD}
function openContent(i){const m=CONTENT[menuType]?.[i];if(!m)return;$('#contentKick').textContent=(menuType+' · '+SEASONS[season].label).toUpperCase();$('#contentTitle').textContent=m[0];$('#contentText').textContent=m[1];$('#contentImg').src=contentImage(menuType,i);$('#contentImg').alt=m[0];$('#contentOverlay').hidden=false;lock()}
function closeOverlay(which){$('#'+which+'Overlay').hidden=true;lock()}
function toast(t){const x=$('#toast');x.textContent=t;x.hidden=false;clearTimeout(timer);timer=setTimeout(()=>x.hidden=true,1800)}
function simple(title,text,body=''){$('#simpleTitle').textContent=title;$('#simpleText').textContent=text;$('#simpleBody').innerHTML=body;$('#simpleOverlay').hidden=false;lock()}
function search(){simple('과일 검색','사계절 상품을 이름과 산지로 검색합니다.',`<input class="searchInput" id="q" placeholder="예: 신고배, 샤인머스켓, 딸기"><div class="searchGrid" id="results"></div>`);renderSearch('');setTimeout(()=>$('#q')?.focus(),0)}
function renderSearch(q){const arr=all().filter(p=>!q||p.name.includes(q)||p.origin.includes(q));$('#results').innerHTML=arr.map(p=>`<button class="searchCard" data-product-id="${p.id}"><img src="${A+p.detail}?v=${BUILD}" alt="${p.name}"><b>${p.name}</b><small>${SEASONS[p.season].label} · ${p.price}</small></button>`).join('')}
function account(){simple('MY IROOM · 계절 미리보기','자동은 현재 월을 기준으로 봄 3–5월, 여름 6–8월, 가을 9–11월, 겨울 12–2월로 전환합니다.',`<div class="seasonrow"><button data-season="spring">봄</button><button data-season="summer">여름</button><button data-season="autumn">가을</button><button data-season="winter">겨울</button><button data-season="auto">자동</button></div>`);syncSeason()}
function loadCart(){try{cart=JSON.parse(get('iroom-v79-cart')||'[]');if(!Array.isArray(cart))cart=[]}catch(_){cart=[]}}
function addCart(p,q){const x=cart.find(v=>v.id===p.id);if(x)x.qty+=q;else cart.push({id:p.id,qty:q});set('iroom-v79-cart',JSON.stringify(cart));toast(p.name+' '+q+'개를 장바구니에 담았습니다.')}
function cartTotal(){return cart.reduce((sum,x)=>{const p=find(x.id);return sum+(p?money(p.price)*x.qty:0)},0)}
function openCart(){const rows=cart.map((x,i)=>{const p=find(x.id);return p?`<div class="cartline"><img src="${A+p.detail}?v=${BUILD}" alt="${p.name}"><div><b>${p.name}</b><small>${p.price} · ${x.qty}개</small></div><button data-remove="${i}">삭제</button></div>`:''}).join('');const sum=cartTotal().toLocaleString('ko-KR')+'원';simple('장바구니','담아둔 상품을 확인합니다.',(rows||'<p>장바구니가 비어 있습니다.</p>')+(cart.length?`<div class="cartSummary"><span>예상 합계</span><strong>${sum}</strong></div><div class="actions" style="margin-top:14px"><button class="add" data-cart-close>계속 쇼핑</button><button class="buy" data-checkout>주문하기</button></div>`:''))}
function checkout(p=current,q=Number($('#qty')?.value||1)){let items;if(p)items=[{id:p.id,qty:q}];else items=cart.slice();if(!items.length){toast('주문할 상품이 없습니다.');return}const total=items.reduce((s,x)=>{const z=find(x.id);return s+(z?money(z.price)*x.qty:0)},0);simple('주문서','배송 정보를 입력하면 주문 내용을 확인할 수 있습니다.',`<div class="cartSummary"><span>주문 예정 금액</span><strong>${total.toLocaleString('ko-KR')}원</strong></div><form class="checkoutForm" id="checkoutForm"><input required name="name" placeholder="받는 분 이름"><input required name="phone" placeholder="연락처"><input class="wide" required name="address" placeholder="배송지 주소"><select name="pay"><option>카드 결제</option><option>무통장 입금</option></select><input name="memo" placeholder="배송 메모"><textarea name="note" placeholder="선물 메시지 또는 요청사항"></textarea><button type="submit">주문 내용 확인</button></form>`);$('#checkoutForm').dataset.items=JSON.stringify(items)}
function finishOrder(){toast('주문 정보가 확인되었습니다. 결제 연결 전 단계입니다.');closeOverlay('simple')}

document.addEventListener('click',e=>{
 const m=e.target.closest('[data-menu]');if(m){showMenu(m.dataset.menu);return}
 if(e.target.closest('[data-menu-close]')){closeMenu();return}
 const mp=e.target.closest('[data-main-product]');if(mp){openProduct({...SEASONS[season].products[Number(mp.dataset.mainProduct)],season});return}
 const ps=e.target.closest('[data-product-slot]');if(ps){const p=menuProducts(season)[Number(ps.dataset.productSlot)];openProduct(p?{...p,season}:null);return}
 const pid=e.target.closest('[data-product-id]');if(pid){openProduct(find(pid.dataset.productId));return}
 const ci=e.target.closest('[data-content-index]');if(ci){openContent(Number(ci.dataset.contentIndex));return}
 const c=e.target.closest('[data-close]');if(c){closeOverlay(c.dataset.close);return}
 const q=e.target.closest('[data-q]');if(q){let n=Math.max(1,parseInt($('#qty').value||'1',10)||1);$('#qty').value=Math.max(1,n+Number(q.dataset.q));return}
 if(e.target.closest('[data-add]')&&current){addCart(current,Math.max(1,parseInt($('#qty').value||'1',10)||1));return}
 if(e.target.closest('[data-buy]')&&current){checkout(current,Math.max(1,parseInt($('#qty').value||'1',10)||1));return}
 const sb=e.target.closest('[data-season]');if(sb){setSeason(sb.dataset.season);closeOverlay('simple');return}
 if(e.target.closest('[data-search]')){search();return}if(e.target.closest('[data-account]')){account();return}if(e.target.closest('[data-cart]')){current=null;openCart();return}
 const rm=e.target.closest('[data-remove]');if(rm){cart.splice(Number(rm.dataset.remove),1);set('iroom-v79-cart',JSON.stringify(cart));openCart();return}
 if(e.target.closest('[data-cart-close]')){closeOverlay('simple');return}if(e.target.closest('[data-checkout]')){current=null;checkout(null);return}
 if(e.target.classList.contains('overlay')){if(e.target.id==='productOverlay')closeOverlay('product');else if(e.target.id==='contentOverlay')closeOverlay('content');else closeOverlay('simple')}
});
document.addEventListener('input',e=>{if(e.target.id==='q')renderSearch(e.target.value.trim())});
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm'){e.preventDefault();finishOrder()}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#productOverlay').hidden){closeOverlay('product');return}if(!$('#contentOverlay').hidden){closeOverlay('content');return}if(!$('#simpleOverlay').hidden){closeOverlay('simple');return}if(!$('#menuScreen').hidden){closeMenu();return}});
loadCart();const saved=get('iroom-v79-season');if(saved==='auto'||!keys.includes(saved)){mode='auto';season=detect()}else{mode='manual';season=saved}setSeason(mode==='auto'?'auto':season);
})();
</script>
</body></html>
