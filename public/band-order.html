<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이룸 주문하기</title><style>
:root{--g:#0b3a27;--line:#e8e0d5;--cream:#faf8f3}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Pretendard","Noto Sans KR",sans-serif;color:#181818;background:#f7f5f1}
.wrap{max-width:1000px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
h1{margin:0}h2{font-size:19px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px}
.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.btn{border:0;border-radius:8px;background:var(--g);color:#fff;padding:13px 18px;font-weight:800;cursor:pointer}.total{text-align:right;font-size:22px;font-weight:800;margin-top:15px}.notice{font-size:12px;color:#666;line-height:1.8}.result{display:none;background:#eef7f1;border:1px solid #bfd9c8;border-radius:12px;padding:18px;margin-top:14px}
@media(max-width:700px){.row{grid-template-columns:1fr}.wrap{padding:15px}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>주문하기</h1><div style="font-size:12px;color:#777">이룸 fresh fruits</div></div><a href="/" style="color:#0b3a27">← 쇼핑 계속하기</a></div>
<div class="box"><h2>주문 상품</h2><div id="items"></div><div class="total" id="total">0원</div></div>
<div class="box"><h2>주문자 · 배송정보</h2><div class="row"><div class="field"><label>주문자명 *</label><input id="name"></div><div class="field"><label>연락처 *</label><input id="phone"></div><div class="field"><label>이메일</label><input id="email"></div><div class="field"><label>우편번호</label><input id="postcode"></div></div><div class="field"><label>주소 *</label><input id="address1"></div><div class="field"><label>상세주소</label><input id="address2"></div><div class="field"><label>배송 메모</label><textarea id="memo"></textarea></div></div>
<div class="box"><h2>결제 방법</h2><select id="payment" style="padding:12px;border:1px solid #ddd;border-radius:7px"><option>무통장입금</option><option disabled>카드결제 (PG 키 연결 후 사용)</option></select><p class="notice">주문 접수 후 안내되는 계좌로 입금해주세요. 실제 카드결제는 Toss Payments 가맹점 키 연결 후 활성화할 수 있습니다.</p><button class="btn" id="orderBtn">주문 접수하기</button><div id="result" class="result"></div></div>
</div><script>
const q=s=>document.querySelector(s);let cart=JSON.parse(localStorage.getItem("iroom_order_cart_v78")||localStorage.getItem("iroom_cart_v62")||"[]"),products=[];
async function load(){const r=await fetch("/api/products");const d=await r.json();products=d.products||[];render();try{const m=await fetch("/api/me").then(r=>r.json());if(m.user){q("#name").value=m.user.name||"";q("#email").value=m.user.email||"";q("#phone").value=m.user.phone||"";q("#postcode").value=m.user.postcode||"";q("#address1").value=m.user.address1||"";q("#address2").value=m.user.address2||""}}catch{}}
function render(){let total=0;q("#items").innerHTML=cart.map(c=>{const p=products.find(x=>x.name===c.name)||products.find(x=>x.id===c.product_id);if(!p)return"";const line=p.price*c.qty;total+=line;c.product_id=p.id;return`<div class="item"><div><b>${p.name}</b><br><small>${p.unit||""}</small></div><div>${c.qty}개 · ${line.toLocaleString()}원</div></div>`}).join("");q("#total").textContent=total.toLocaleString()+"원";localStorage.setItem("iroom_cart_v62",JSON.stringify(cart))}
q("#orderBtn").onclick=async()=>{if(!cart.length)return alert("장바구니가 비어 있습니다.");const body={items:cart.map(c=>({product_id:c.product_id,qty:c.qty})),customer_name:q("#name").value,phone:q("#phone").value,email:q("#email").value,postcode:q("#postcode").value,address1:q("#address1").value,address2:q("#address2").value,memo:q("#memo").value,payment_method:q("#payment").value};try{const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"주문 실패");q("#result").style.display="block";q("#result").innerHTML=`<b>주문이 접수되었습니다.</b><br>주문번호: ${d.order_no}<br>결제금액: ${Number(d.total_amount).toLocaleString()}원<br><br><b>${d.bank.name} ${d.bank.account}</b><br>예금주: ${d.bank.holder}`;const mainCart=JSON.parse(localStorage.getItem("iroom_cart_v62")||"[]");
const orderedKeys=new Set(cart.map(x=>String(x.product_id||x.name)));
const remaining=mainCart.filter(x=>!orderedKeys.has(String(x.product_id||x.name)));
localStorage.setItem("iroom_cart_v62",JSON.stringify(remaining));
localStorage.removeItem("iroom_order_cart_v78");
cart=[]}catch(e){alert(e.message)}}

function formatPhoneValue(v){
  const n=String(v||"").replace(/\D/g,"").slice(0,11);
  if(n.length<=3)return n;
  if(n.length<=7)return n.slice(0,3)+"-"+n.slice(3);
  return n.slice(0,3)+"-"+n.slice(3,7)+"-"+n.slice(7);
}
q("#phone")?.addEventListener("input",()=>{q("#phone").value=formatPhoneValue(q("#phone").value)});

load();
</script></body></html>
