<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주문하기 | 이룸</title><style>body{margin:0;background:#fbf7ee;color:#17382a;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:780px;margin:auto;padding:24px}.head{display:flex;align-items:center;gap:18px}.head a{color:#073b2c;font-weight:900;text-decoration:none}.box{background:#fff;border:1px solid #dfd2bd;border-radius:18px;padding:22px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:900}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #d8cdbd;border-radius:9px}textarea{min-height:90px}.wide{grid-column:1/-1}button{width:100%;padding:14px;background:#073b2c;color:#fff;border:0;border-radius:10px;font-weight:900;margin-top:16px}@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:1}}</style></head><body><main class="wrap"><div class="head"><a href="/" title="이전 화면" aria-label="이전 화면">←</a><h1>주문하기</h1></div><section class="box"><h2>주문 상품</h2><div id="items"></div></section><section class="box"><h2>배송 정보</h2><div class="grid"><label>주문자<input required></label><label>연락처<input required></label><label class="wide">받는 주소<input required></label><label>배송 희망일<input type="date"></label><label>선물포장<select><option>선택 안 함</option><option>선물포장</option><option>고급 선물포장</option></select></label><label class="wide">배송 메모<textarea></textarea></label></div><button type="button">주문 상담 요청</button></section></main><script>const items=JSON.parse(localStorage.getItem('iroom_order_cart_v78')||'[]');document.querySelector('#items').innerHTML=items.length?items.map(x=>`<p><b>${x.name}</b> · ${x.qty||1}개 · ${Number(x.price||0).toLocaleString()}원</p>`).join(''):'선택한 상품이 없습니다.';</script></body></html>
