<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이룸 운영 관리자센터</title>
<style>
:root{--g:#082d20;--g2:#124a36;--gold:#b99052;--cream:#faf7ef;--line:#e8dfd1}*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Pretendard","Noto Sans KR",sans-serif;color:#181818;background:#f7f6f2}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--g);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:21px}.wrap{max-width:1440px;margin:auto;padding:22px}
.login{max-width:420px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:15px;padding:28px}.login input{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin:12px 0}.btn{border:0;border-radius:8px;background:var(--g);color:#fff;padding:11px 16px;font-weight:800}.outline{background:#fff;color:#222;border:1px solid #ddd}
#app{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-weight:700}.tab.on{background:var(--g);color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card strong{font-size:25px;display:block;margin-top:8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-top:16px;overflow:auto}.panel h2{margin:0 0 14px}
table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;border-bottom:1px solid #eee;padding:10px;font-size:12px;vertical-align:top}th{background:#faf8f3}
input,select,textarea{border:1px solid #ddd;border-radius:6px;padding:8px}.small{font-size:11px;color:#777}.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.formrow input{width:100%}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid2,.formrow{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body>
<div class="top"><div><b>이룸 운영 관리자센터</b><div style="font-size:11px;opacity:.7">PRODUCT · ORDER · MEMBER · STOCK</div></div><button class="btn outline" onclick="location.href='/'">홈페이지</button></div>
<div id="login" class="login"><h2>관리자 로그인</h2><p class="small">환경변수 ADMIN_PASSWORD에 설정된 비밀번호를 입력하세요.</p><input id="adminPw" type="password" placeholder="관리자 비밀번호"><button class="btn" id="loginBtn">로그인</button><p id="loginMsg" class="small"></p></div>
<div id="app" class="wrap">
 <div class="tabs"><button class="tab on" data-tab="dashboard">대시보드</button><button class="tab" data-tab="products">상품·재고</button><button class="tab" data-tab="orders">주문·배송</button><button class="tab" data-tab="users">회원</button><button class="tab" id="logoutBtn">로그아웃</button></div>
 <section id="dashboard" class="view"><div class="cards"><div class="card">판매상품<strong id="dProducts">0</strong></div><div class="card">총재고<strong id="dStock">0</strong></div><div class="card">총주문<strong id="dOrders">0</strong></div><div class="card">오늘매출<strong id="dSales">0원</strong></div></div><div class="panel"><h2>운영 상태</h2><p>상품·재고를 수정하면 고객 홈페이지에서 API를 통해 최신 값을 불러옵니다. 주문 상태와 입금 상태도 여기에서 처리할 수 있습니다.</p></div></section>
 <section id="products" class="view hidden"><div class="panel"><h2>상품 추가</h2><div class="formrow"><input id="npName" placeholder="상품명"><input id="npPrice" type="number" placeholder="가격"><input id="npStock" type="number" placeholder="재고"><input id="npUnit" placeholder="규격"><input id="npCategory" placeholder="카테고리"><input id="npImage" placeholder="/assets/파일.jpg"></div><textarea id="npDesc" placeholder="설명" style="width:100%;margin-top:8px"></textarea><button class="btn" id="addProduct" style="margin-top:8px">상품 등록</button></div><div class="panel"><h2>상품·재고 관리</h2><div id="productTable"></div></div></section>
 <section id="orders" class="view hidden"><div class="panel"><h2>주문·배송 관리</h2><div id="orderTable"></div></div></section>
 <section id="users" class="view hidden"><div class="panel"><h2>회원 관리</h2><div id="userTable"></div></div></section>
</div>
<script>
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"요청 실패");return d}
async function check(){const d=await api("/api/admin/me");if(d.admin){q("#login").style.display="none";q("#app").style.display="block";loadDashboard()} }
q("#loginBtn").onclick=async()=>{try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:q("#adminPw").value})});q("#login").style.display="none";q("#app").style.display="block";loadDashboard()}catch(e){q("#loginMsg").textContent=e.message}}
q("#logoutBtn").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});location.reload()}
qa("[data-tab]").forEach(b=>b.onclick=()=>{qa(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");qa(".view").forEach(v=>v.classList.add("hidden"));q("#"+b.dataset.tab).classList.remove("hidden");if(b.dataset.tab==="products")loadProducts();if(b.dataset.tab==="orders")loadOrders();if(b.dataset.tab==="users")loadUsers();if(b.dataset.tab==="dashboard")loadDashboard()})
async function loadDashboard(){const d=await api("/api/admin/dashboard");q("#dProducts").textContent=d.products.count;q("#dStock").textContent=d.products.stock;q("#dOrders").textContent=d.orders;q("#dSales").textContent=Number(d.today.sales||0).toLocaleString()+"원"}
async function loadProducts(){const d=await api("/api/admin/products");q("#productTable").innerHTML='<table><tr><th>ID</th><th>상품</th><th>가격</th><th>재고</th><th>규격</th><th>카테고리</th><th>판매</th><th>저장</th></tr>'+d.products.map(p=>`<tr><td>${p.id}</td><td><input id="n${p.id}" value="${esc(p.name)}"></td><td><input id="p${p.id}" type="number" value="${p.price}" style="width:100px"></td><td><input id="s${p.id}" type="number" value="${p.stock}" style="width:80px"></td><td><input id="u${p.id}" value="${esc(p.unit||"")}"></td><td><input id="c${p.id}" value="${esc(p.category||"")}"></td><td><input id="a${p.id}" type="checkbox" ${p.is_active?"checked":""}></td><td><button class="btn" onclick="saveProduct(${p.id})">저장</button></td></tr>`).join("")+"</table>"}
async function saveProduct(id){await api("/api/admin/products/"+id,{method:"PUT",body:JSON.stringify({name:q("#n"+id).value,price:Number(q("#p"+id).value),stock:Number(q("#s"+id).value),unit:q("#u"+id).value,category:q("#c"+id).value,is_active:q("#a"+id).checked})});alert("저장했습니다.");loadProducts();loadDashboard()}
q("#addProduct").onclick=async()=>{await api("/api/admin/products",{method:"POST",body:JSON.stringify({name:q("#npName").value,price:Number(q("#npPrice").value||0),stock:Number(q("#npStock").value||0),unit:q("#npUnit").value,category:q("#npCategory").value,image:q("#npImage").value,description:q("#npDesc").value})});["npName","npPrice","npStock","npUnit","npCategory","npImage","npDesc"].forEach(id=>q("#"+id).value="");loadProducts();loadDashboard()}
async function loadOrders(){const d=await api("/api/admin/orders");q("#orderTable").innerHTML='<table><tr><th>주문번호</th><th>고객</th><th>상품</th><th>금액</th><th>결제</th><th>진행상태</th><th>배송지</th><th>저장</th></tr>'+d.orders.map(o=>`<tr><td>${o.order_no}<br><span class="small">${new Date(o.created_at).toLocaleString()}</span></td><td>${esc(o.customer_name)}<br>${esc(o.phone)}</td><td>${o.items.map(i=>esc(i.product_name)+" × "+i.qty).join("<br>")}</td><td>${Number(o.total_amount).toLocaleString()}원</td><td><select id="pay${o.id}">${["입금대기","결제완료","환불"].map(x=>`<option ${o.payment_status===x?"selected":""}>${x}</option>`).join("")}</select></td><td><select id="st${o.id}">${["주문접수","상품준비","배송중","배송완료","취소"].map(x=>`<option ${o.status===x?"selected":""}>${x}</option>`).join("")}</select></td><td>${esc(o.address1)} ${esc(o.address2||"")}</td><td><button class="btn" onclick="saveOrder(${o.id})">저장</button></td></tr>`).join("")+"</table>"}
async function saveOrder(id){await api("/api/admin/orders/"+id,{method:"PUT",body:JSON.stringify({status:q("#st"+id).value,payment_status:q("#pay"+id).value})});alert("주문 상태를 저장했습니다.");loadOrders();loadDashboard()}
async function loadUsers(){const d=await api("/api/admin/users");q("#userTable").innerHTML='<table><tr><th>ID</th><th>아이디</th><th>이름</th><th>이메일</th><th>연락처</th><th>주소</th><th>가입일</th></tr>'+d.users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.username||"")}</td><td>${esc(u.name)}</td><td>${esc(u.email||"")}</td><td>${esc(u.phone||"")}</td><td>${esc((u.postcode||"")+" "+(u.address1||"")+" "+(u.address2||""))}</td><td>${new Date(u.created_at).toLocaleString()}</td></tr>`).join("")+"</table>"}
function esc(v){
  return String(v??"").replace(/[&<>"']/g, function(m){
    const map={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
    return map[m];
  });
}
check().catch(()=>{});
</script></body></html>
