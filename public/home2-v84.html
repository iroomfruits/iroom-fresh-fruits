function curation(){const ps=pset();return `<div class="page canvas">${head('과일 큐레이션','IROOM CURATION','상황을 고르면 추천 과일과 가격이 바로 보이고, 구성 전체를 한 번에 담을 수 있습니다.')}<div class="editorialGrid">${curations.map((c,i)=>`<article class="editorial"><span class="eyebrow">CURATION 0${i+1}</span><h2>${c[0]}</h2><p>${c[1]}</p><div class="thumbs">${maps[i].map(j=>{const p=ps[j%ps.length];return `<button data-product="${p.id}"><img src="${img(p)}" alt="${p.name}"><span>${p.name}</span></button>`}).join('')}</div><div class="bundleMeta"><span>${maps[i].length}가지 과일 추천 구성</span><strong>${fmt(maps[i].reduce((n,j)=>n+price(ps[j%ps.length]),0))}</strong></div><div class="bundleActions"><button class="btn" data-cur-add="${i}">전체 담기</button><button class="btn dark" data-cur-buy="${i}">구성 주문</button></div></article>`).join('')}</div></div>${footer()}`}

function guide(){return `<div class="page canvas">${head('과일 가이드','FRUIT GUIDE','고르는 기준, 보관, 먹는 온도까지 구매 후 실제로 필요한 정보만 정리했습니다.')}<div class="editorialGrid"><article class="editorial"><span class="eyebrow">SELECT</span><h2>좋은 과일 고르는 법</h2><p>색 하나보다 향, 탄력, 꼭지 상태를 함께 봅니다.</p><ul><li>같은 품종이라도 크기보다 선도와 향을 함께 확인합니다.</li><li>과일마다 완숙과 후숙의 기준이 다릅니다.</li></ul></article><article class="editorial"><span class="eyebrow">STORAGE</span><h2>오래 보관하는 법</h2><p>냉장 보관과 후숙이 필요한 과일을 먼저 구분합니다.</p><ul><li>서로 다른 과일을 한 봉투에 오래 밀폐하지 않습니다.</li><li>수령 후 상태를 확인하고 가장 맛있는 시기를 놓치지 않습니다.</li></ul></article><article class="editorial"><span class="eyebrow">SERVE</span><h2>더 맛있게 먹는 법</h2><p>향이 좋은 과일은 너무 차갑지 않게 두면 풍미가 더 살아납니다.</p><ul><li>먹기 직전에 손질해 수분과 향을 지킵니다.</li><li>과일마다 가장 맛있는 온도를 다르게 봅니다.</li></ul></article></div></div>${footer()}`}
function story(){return `<div class="page canvas">${head('이룸의 이야기','IROOM STORY','좋은 과일을 제대로 고르고, 이해하기 쉽게 보여주는 일을 중요하게 생각합니다.')}<div class="editorialGrid"><article class="editorial"><span class="eyebrow">01 · FRESH</span><h2>신선함</h2><p>입고와 선도를 우선해 설명합니다. 계절의 분위기보다 지금 살 수 있는 과일의 상태를 먼저 봅니다.</p></article><article class="editorial"><span class="eyebrow">02 · SELECT</span><h2>선별</h2><p>상품마다 산지, 중량, 구성과 특징을 명확하게 보여줍니다.</p></article><article class="editorial"><span class="eyebrow">03 · DAILY</span><h2>일상</h2><p>선물뿐 아니라 매일 먹기 좋은 과일까지, 좋은 과일이 자연스럽게 일상에 들어오도록 제안합니다.</p></article></div></div>${footer()}`}
function search(){return `<div class="page canvas">${head('과일 검색','SEARCH','상품명과 산지로 검색하세요.')}<div class="pageTools"><div class="searchSort"><input id="globalQ" style="width:360px" placeholder="예: 신고배, 샤인머스켓, 딸기"><button class="btn dark" id="searchBtn">검색</button></div></div><div class="catalog" id="results"></div></div>${footer()}`}
function account(){return `<div class="page canvas">${head('MY IROOM','MY IROOM','로그인과 주문 조회는 기존 백엔드 연결 시 활성화됩니다. 이 화면은 쇼핑 흐름을 위한 프론트 구조입니다.')}<div class="editorialGrid"><article class="editorial"><span class="eyebrow">LOGIN</span><h2>로그인</h2><p>회원 정보와 주문 이력을 연결하는 영역입니다.</p><button class="btn dark" data-demo>로그인 준비중</button></article><article class="editorial"><span class="eyebrow">ORDER</span><h2>주문 조회</h2><p>주문 번호와 연락처로 비회원 주문을 확인하는 영역입니다.</p><button class="btn" data-demo>주문 조회 준비중</button></article><article class="editorial"><span class="eyebrow">SEASON PREVIEW</span><h2>계절 미리보기</h2><p>운영 확인용으로만 계절 상품을 바꿔봅니다. 화면 디자인은 그대로 유지됩니다.</p><div class="filters">${seasons.map(s=>`<button data-season="${s}" class="${season===s?'on':''}">${labels[s]}</button>`).join('')}</div></article></div></div>${footer()}`}
function checkoutPage(){const items=checkoutItems.length?checkoutItems:cart.slice();const line=x=>{const e=ent(x);if(!e)return'';const src=e.kind==='gift'?(A+e.image+'?v='+BUILD):img(e);return `<div class="orderLine"><img src="${src}" alt="${e.name}"><span><b>${e.name}</b><small>${x.qty}개 · ${e.kind==='gift'?'선물세트':e.origin}</small></span><strong>${fmt(eprice(x)*x.qty)}</strong></div>`};return `<div class="page canvas">${head('주문서','CHECKOUT','상품과 배송 정보를 확인하세요. 실제 PG와 주문 DB 저장은 기존 백엔드 연결 단계에서 활성화됩니다.')}<div class="checkoutWrap"><form class="checkoutForm" id="orderForm"><input required name="name" placeholder="받는 분 이름"><input required name="phone" placeholder="연락처"><input class="wide" required name="address" placeholder="배송지 주소"><select name="pay"><option>카드 결제</option><option>무통장 입금</option></select><input name="memo" placeholder="배송 메모"><textarea class="wide" name="note" placeholder="선물 메시지 또는 요청사항"></textarea><button class="btn dark submit" type="submit">주문 내용 확인</button></form><aside class="orderSummary"><span class="eyebrow">ORDER SUMMARY</span><h3>주문 상품</h3>${items.map(line).join('')}<div class="orderTotal"><span>주문 예정 금액</span><strong>${fmt(items.reduce((n,x)=>n+eprice(x)*x.qty,0))}</strong></div></aside></div></div>${footer()}`}
function product(){const p=current;if(!p)return fruits();return `<div class="page canvas"><div class="detail"><div class="crumb"><button class="link" data-back>← 상품 목록</button> · ${p.name}</div><div class="detailTop"><div class="detailVisual"><img src="${img(p)}" alt="${p.name}"></div><div class="detailInfo"><span class="eyebrow">IROOM SELECT · ${labels[p.season]}</span><h1>${p.name}</h1><p class="intro">과일의 선도와 맛, 구성의 균형을 기준으로 고른 이룸의 현재 판매 상품입니다.</p><div class="detailPrice">${p.price}</div><div class="infoRows"><div class="infoRow"><span>산지</span><b>${p.origin}</b></div><div class="infoRow"><span>구성</span><b>${p.pack}</b></div><div class="infoRow"><span>선별</span><b>이룸 셀렉트 기준</b></div><div class="infoRow"><span>배송</span><b>신선식품 포장 · 출고 안내</b></div></div><div class="qtyLine"><div class="qty"><button data-qty="-1">−</button><input id="qty" value="1"><button data-qty="1">＋</button></div><div class="sum"><small>상품 합계</small><strong id="sum">${p.price}</strong></div></div><div class="detailActions"><button class="btn" data-detail-add="${p.id}">장바구니 담기</button><button class="btn dark" data-detail-buy="${p.id}">BUY NOW</button></div></div></div><div class="detailNotes"><div class="detailNote"><span class="eyebrow">PRODUCT</span><h3>상품 안내</h3><p>입고 상태에 따라 실제 크기와 색감에는 자연스러운 차이가 있을 수 있습니다.</p></div><div class="detailNote"><span class="eyebrow">STORAGE</span><h3>보관 가이드</h3><p>수령 후 상태와 후숙 여부를 확인하고 과일별 적정 온도에 맞춰 보관하세요.</p></div><div class="detailNote"><span class="eyebrow">DELIVERY</span><h3>배송 안내</h3><p>신선식품 특성상 배송 중 자연스러운 흔들림이 있을 수 있으며 실제 운영정책과 연결됩니다.</p></div></div></div></div>${footer()}`}
function giftDetail(i){const g=giftObj(i);return `<div class="page canvas"><div class="detail"><div class="crumb"><button class="link" data-back>← 선물세트</button> · ${g.name}</div><div class="detailTop"><div class="detailVisual"><img src="${A+g.image}?v=${BUILD}" alt="${g.name}"></div><div class="detailInfo"><span class="eyebrow">IROOM GIFT</span><h1>${g.name}</h1><p class="intro">${g.desc}</p><div class="detailPrice">${fmt(g.price)}~</div><div class="infoRows"><div class="infoRow"><span>구성</span><b>계절 대표 과일 맞춤 구성</b></div><div class="infoRow"><span>포장</span><b>이룸 선물 포장</b></div><div class="infoRow"><span>배송</span><b>신선식품 선물 배송</b></div></div><div class="qtyLine"><div class="qty"><button data-gqty="-1">−</button><input id="gqty" value="1"><button data-gqty="1">＋</button></div><div class="sum"><small>상품 합계</small><strong id="gsum">${fmt(g.price)}</strong></div></div><div class="detailActions"><button class="btn" data-gift-add="${i}">장바구니 담기</button><button class="btn dark" data-gift-buy="${i}">BUY NOW</button></div></div></div></div></div>${footer()}`}
function render(){const app=$('#app');app.innerHTML=route==='home'?home():route==='fruits'?fruits():route==='gifts'?gifts():route==='curation'?curation():route==='picnic'?picnic():route==='guide'?guide():route==='story'?story():route==='search'?search():route==='account'?account():route==='checkout'?checkoutPage():route==='product'?product():home();$$('.nav [data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));window.scrollTo({top:0,behavior:'instant'});bind()}
function go(r){closeDetail();route=r;history.pushState({r},'',r==='home'?'#home':'#'+r);render()}
function bind(){if(route==='fruits'){$$('[data-filter]').forEach(b=>b.onclick=()=>{$$('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterProducts()});$('#q').oninput=filterProducts;$('#sort').onchange=filterProducts}if(route==='search'){renderSearch('');$('#globalQ').oninput=e=>renderSearch(e.target.value.trim());$('#searchBtn').onclick=()=>renderSearch($('#globalQ').value.trim())}}
function filterProducts(){let arr=pset().slice(),f=$('[data-filter].on')?.dataset.filter||'all',q=($('#q')?.value||'').trim(),s=$('#sort')?.value||'default';if(f==='under35')arr=arr.filter(p=>price(p)<=35000);if(f==='over36')arr=arr.filter(p=>price(p)>=36000);if(q)arr=arr.filter(p=>p.name.includes(q)||p.origin.includes(q));if(s==='low')arr.sort((a,b)=>price(a)-price(b));if(s==='high')arr.sort((a,b)=>price(b)-price(a));$('#catalog').innerHTML=arr.map(prod).join('')}
function renderSearch(q){const arr=Object.values(DATA).flatMap(s=>[...s.products,...(s.extra||[])]).filter(p=>!q||p.name.includes(q)||p.origin.includes(q)).slice(0,12);$('#results').innerHTML=arr.map(prod).join('')}
function loadCart(){try{cart=JSON.parse(localStorage.getItem('iroom-v84-cart')||'[]');if(!Array.isArray(cart))cart=[]}catch(_){cart=[]}saveCart()}
function saveCart(){try{localStorage.setItem('iroom-v84-cart',JSON.stringify(cart))}catch(_){}const n=cart.reduce((s,x)=>s+x.qty,0),b=$('#badge');b.textContent=n;b.hidden=!n;if(!$('#drawer').hidden)drawCart()}
function add(id,qty=1){const x=cart.find(v=>v.kind==='product'&&v.id===id);if(x)x.qty+=qty;else cart.push({kind:'product',id,qty});saveCart();toast((find(id)?.name||'상품')+'을 담았습니다.')}
function addGift(i,qty=1){const id='gift-'+season+'-'+i,x=cart.find(v=>v.kind==='gift'&&v.id===id);if(x)x.qty+=qty;else cart.push({kind:'gift',id,qty});saveCart();toast(giftNames[i]+'을 담았습니다.')}
function ent(x){if(x.kind==='gift'){const i=Number(x.id.split('-').pop()),g=giftObj(i);return {...g,kind:'gift'}}const p=find(x.id);return p?{...p,kind:'product'}:null} function eprice(x){const e=ent(x);return e?(e.kind==='gift'?e.price:price(e)):0}
function drawCart(){if(!cart.length){$('#cartBody').innerHTML='<p style="padding:25px 5px;color:#778078;font-size:11px">장바구니가 비어 있습니다.</p>';$('#cartTotal').textContent='0원';return}$('#cartBody').innerHTML=cart.map((x,i)=>{const e=ent(x);if(!e)return'';const im=e.kind==='gift'?(A+e.image+'?v='+BUILD):img(e);return `<div class="cartLine"><img src="${im}" alt="${e.name}"><div><h4>${e.name}</h4><small>${fmt(eprice(x))}</small><div class="cartQty"><button data-cqty="${i}:-1">−</button><b>${x.qty}</b><button data-cqty="${i}:1">＋</button></div></div><button class="remove" data-remove="${i}">삭제</button></div>`}).join('');$('#cartTotal').textContent=fmt(cart.reduce((s,x)=>s+eprice(x)*x.qty,0))}
function openCart(){drawCart();$('#scrim').hidden=false;$('#drawer').hidden=false;document.body.classList.add('lock')}function closeCart(){$('#scrim').hidden=true;$('#drawer').hidden=true;document.body.classList.remove('lock')}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(timer);timer=setTimeout(()=>el.hidden=true,1600)}function qty(){return Math.max(1,parseInt($('#qty')?.value||'1',10)||1)}function gqty(){return Math.max(1,parseInt($('#gqty')?.value||'1',10)||1)}
function buy(items){checkoutItems=items;closeDetail();closeCart();go('checkout')}function checkout(){if(cart.length)buy(cart.slice());else toast('장바구니가 비어 있습니다.')} 

function productDetailMarkup(p){return `<button class="detailClose" data-detail-close aria-label="상세보기 닫기">×</button><div class="detail"><div class="crumb"><button class="link" data-detail-close>← 상품 목록으로</button> · ${p.name}</div><div class="detailTop"><div class="detailVisual"><img src="${img(p)}" alt="${p.name}"></div><div class="detailInfo"><span class="eyebrow">IROOM SELECT · ${labels[p.season]}</span><h1>${p.name}</h1><p class="intro">과일의 선도와 맛, 구성의 균형을 기준으로 고른 이룸의 현재 판매 상품입니다.</p><div class="detailPrice">${p.price}</div><div class="infoRows"><div class="infoRow"><span>산지</span><b>${p.origin}</b></div><div class="infoRow"><span>구성</span><b>${p.pack}</b></div><div class="infoRow"><span>선별</span><b>이룸 셀렉트 기준</b></div><div class="infoRow"><span>배송</span><b>신선식품 포장 · 출고 안내</b></div></div><div class="qtyLine"><div class="qty"><button data-qty="-1">−</button><input id="qty" value="1"><button data-qty="1">＋</button></div><div class="sum"><small>상품 합계</small><strong id="sum">${p.price}</strong></div></div><div class="detailActions"><button class="btn" data-detail-add="${p.id}">장바구니 담기</button><button class="btn dark" data-detail-buy="${p.id}">BUY NOW</button></div></div></div><div class="detailNotes"><div class="detailNote"><span class="eyebrow">PRODUCT</span><h3>상품 안내</h3><p>입고 상태에 따라 실제 크기와 색감에는 자연스러운 차이가 있을 수 있습니다.</p></div><div class="detailNote"><span class="eyebrow">STORAGE</span><h3>보관 가이드</h3><p>수령 후 상태와 후숙 여부를 확인하고 과일별 적정 온도에 맞춰 보관하세요.</p></div><div class="detailNote"><span class="eyebrow">DELIVERY</span><h3>배송 안내</h3><p>신선식품 특성상 배송 중 자연스러운 흔들림이 있을 수 있으며 실제 운영정책과 연결됩니다.</p></div></div></div>`}
function giftDetailMarkup(i){const g=giftObj(i);return `<button class="detailClose" data-detail-close aria-label="선물 상세 닫기">×</button><div class="detail"><div class="crumb"><button class="link" data-detail-close>← 선물세트로</button> · ${g.name}</div><div class="detailTop"><div class="detailVisual"><img src="${A+g.image}?v=${BUILD}" alt="${g.name}"></div><div class="detailInfo"><span class="eyebrow">IROOM GIFT</span><h1>${g.name}</h1><p class="intro">${g.desc}</p><div class="detailPrice">${fmt(g.price)}~</div><div class="infoRows"><div class="infoRow"><span>구성</span><b>계절 대표 과일 맞춤 구성</b></div><div class="infoRow"><span>포장</span><b>이룸 선물 포장</b></div><div class="infoRow"><span>배송</span><b>신선식품 선물 배송</b></div></div><div class="qtyLine"><div class="qty"><button data-gqty="-1">−</button><input id="gqty" value="1"><button data-gqty="1">＋</button></div><div class="sum"><small>상품 합계</small><strong id="gsum">${fmt(g.price)}</strong></div></div><div class="detailActions"><button class="btn" data-gift-add="${i}">장바구니 담기</button><button class="btn dark" data-gift-buy="${i}">BUY NOW</button></div></div></div></div>`}
function openProductDetail(id){current=find(id);if(!current)return;lastFocus=document.activeElement;const ov=$('#detailOverlay');$('#detailSheet').innerHTML=productDetailMarkup(current);delete ov.dataset.gift;ov.hidden=false;document.body.classList.add('lock');requestAnimationFrame(()=>$('#detailSheet .detailClose')?.focus({preventScroll:true}))}
function openGiftDetail(i){lastFocus=document.activeElement;const ov=$('#detailOverlay');ov.dataset.gift=String(i);$('#detailSheet').innerHTML=giftDetailMarkup(i);ov.hidden=false;document.body.classList.add('lock');requestAnimationFrame(()=>$('#detailSheet .detailClose')?.focus({preventScroll:true}))}
function closeDetail(){const ov=$('#detailOverlay');if(!ov||ov.hidden)return;ov.hidden=true;$('#detailSheet').innerHTML='';delete ov.dataset.gift;document.body.classList.remove('lock');const f=lastFocus;lastFocus=null;if(f&&typeof f.focus==='function')requestAnimationFrame(()=>f.focus({preventScroll:true}))}
document.addEventListener('click',e=>{if(e.target.closest('[data-detail-close]')||e.target.id==='detailOverlay'){closeDetail();return}const r=e.target.closest('[data-route]');if(r){go(r.dataset.route);return}const p=e.target.closest('[data-product]');if(p){openProductDetail(p.dataset.product);return}const a=e.target.closest('[data-add]');if(a){add(a.dataset.add);return}if(e.target.closest('[data-cart]')){openCart();return}if(e.target.closest('[data-close-cart]')||e.target.id==='scrim'){closeCart();return}const g=e.target.closest('[data-gift]');if(g){openGiftDetail(Number(g.dataset.gift));return}const ga=e.target.closest('[data-gift-add]');if(ga){addGift(Number(ga.dataset.giftAdd),gqty());return}const gb=e.target.closest('[data-gift-buy]');if(gb){const i=Number(gb.dataset.giftBuy);buy([{kind:'gift',id:'gift-'+season+'-'+i,qty:gqty()}]);return}const ca=e.target.closest('[data-cur-add]');if(ca){maps[Number(ca.dataset.curAdd)].forEach(j=>add(pset()[j%pset().length].id));return}const caBuy=e.target.closest('[data-cur-buy]');if(caBuy){const items=maps[Number(caBuy.dataset.curBuy)].map(j=>({kind:'product',id:pset()[j%pset().length].id,qty:1}));buy(items);return}const sa=e.target.closest('[data-set-add]');if(sa){sa.dataset.setAdd.split(',').map(Number).forEach(j=>add(pset()[j%pset().length].id));return}const sb=e.target.closest('[data-set-buy]');if(sb){const items=sb.dataset.setBuy.split(',').map(Number).map(j=>({kind:'product',id:pset()[j%pset().length].id,qty:1}));buy(items);return}const q=e.target.closest('[data-qty]');if(q){$('#qty').value=Math.max(1,qty()+Number(q.dataset.qty));$('#sum').textContent=fmt(price(current)*qty());return}const gq=e.target.closest('[data-gqty]');if(gq){const i=Number($('#detailOverlay').dataset.gift);$('#gqty').value=Math.max(1,gqty()+Number(gq.dataset.gqty));$('#gsum').textContent=fmt(giftPrices[i]*gqty());return}const da=e.target.closest('[data-detail-add]');if(da){add(da.dataset.detailAdd,qty());return}const db=e.target.closest('[data-detail-buy]');if(db){buy([{kind:'product',id:db.dataset.detailBuy,qty:qty()}]);return}const cq=e.target.closest('[data-cqty]');if(cq){const [i,d]=cq.dataset.cqty.split(':').map(Number);cart[i].qty=Math.max(1,cart[i].qty+d);saveCart();return}const rm=e.target.closest('[data-remove]');if(rm){cart.splice(Number(rm.dataset.remove),1);saveCart();return}if(e.target.closest('[data-checkout]')){checkout();return}if(e.target.closest('[data-back]')){closeDetail();return}const ss=e.target.closest('[data-season]');if(ss){season=ss.dataset.season;render();toast(labels[season]+' 상품으로 미리보기 전환');return}if(e.target.closest('[data-demo]')){toast('백엔드 연결 단계에서 활성화됩니다.');return}})
document.addEventListener('input',e=>{if(e.target.id==='qty')$('#sum').textContent=fmt(price(current)*qty());if(e.target.id==='gqty'){const i=Number($('#app').dataset.gift);$('#gsum').textContent=fmt(giftPrices[i]*gqty())}})
document.addEventListener('submit',e=>{if(e.target.id==='orderForm'){e.preventDefault();toast('주문 정보 확인 완료 · 실제 결제 연결 전 단계입니다.')}})
document.addEventListener('pointerdown',()=>document.body.classList.remove('keyboardNav'),true);document.addEventListener('keydown',e=>{if(e.key==='Tab')document.body.classList.add('keyboardNav')},true);window.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#detailOverlay').hidden){e.preventDefault();e.stopPropagation();closeDetail();return}if(!$('#drawer').hidden){e.preventDefault();e.stopPropagation();closeCart();return}},true);window.addEventListener('popstate',()=>{closeDetail();const h=location.hash.replace('#','');route=['home','fruits','gifts','curation','picnic','guide','story','search','account','checkout'].includes(h)?h:'home';render()})
loadCart();render();
})();
