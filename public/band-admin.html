<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이룸 공구 운영센터</title><style>body{margin:0;background:#f4f5f1;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#17251f}.wrap{max-width:980px;margin:auto;padding:18px}.head{background:#082f23;color:#fff;padding:20px;border-radius:16px}.head h1{color:#dfb259;margin:0}.card{background:#fff;border-radius:15px;padding:16px;margin:12px 0;border:1px solid #e6e1d5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd4ce;border-radius:10px;font-size:15px;box-sizing:border-box}button{border:0;background:#0e513d;color:#fff;padding:11px 14px;border-radius:10px;font-weight:800;cursor:pointer}.gold{background:#dfb259;color:#17251f}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.scroll{overflow:auto}.hide{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="head"><h1>이룸 공구 운영센터</h1><p>BAND 공동구매를 등록하고 참여자를 확인합니다.</p></section><section id="login" class="card"><h2>관리자 로그인</h2><input id="pw" type="password" placeholder="관리자 비밀번호"><button id="loginBtn" style="margin-top:8px">로그인</button></section><div id="app" class="hide"><section class="card"><h2>새 공동구매 등록</h2><div class="grid"><input id="title" placeholder="공구 상품명"><input id="price" type="number" placeholder="공구가"><input id="unit" placeholder="구성 예: 2kg"><input id="deadline" placeholder="마감일 예: 2026-09-01"><input id="target" type="number" placeholder="목표수량"><select id="product"></select></div><textarea id="desc" placeholder="공구 설명" style="margin-top:8px"></textarea><button class="gold" id="create" style="margin-top:8px">공동구매 등록</button></section><section class="card"><h2>공동구매 목록</h2><div class="scroll"><table><thead><tr><th>상태</th><th>상품</th><th>가격</th><th>참여수량</th><th>마감</th><th>관리</th></tr></thead><tbody id="grows"></tbody></table></div></section><section class="card"><h2>최근 참여자</h2><div class="scroll"><table><thead><tr><th>시간</th><th>공구ID</th><th>성함</th><th>전화</th><th>수량</th><th>수령</th><th>주소</th></tr></thead><tbody id="prows"></tbody></table></div></section><p><a href="/band-order.html" target="_blank">고객 BAND 주문센터 미리보기 →</a></p></div></main><script>let token=sessionStorage.getItem('iroomAdminToken')||'';const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(u,o),d=await r.json();if(!r.ok)throw new Error(d.error||'요청 실패');return d}async function login(){try{const d=await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});token=d.token;sessionStorage.setItem('iroomAdminToken',token);show()}catch(e){alert(e.message)}}async function show(){$('login').classList.add('hide');$('app').classList.remove('hide');const st=await api('/api/store');$('product').innerHTML='<option value="">상품 연결 안함</option>'+st.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');await load()}async function load(){const d=await api('/api/admin/groupbuys');$('grows').innerHTML=d.groupBuys.map(g=>`<tr><td>${g.active===false?'종료':'진행'}</td><td>${g.title}</td><td>${Number(g.price||0).toLocaleString()}</td><td>${g.joinedQty||0}</td><td>${g.deadline||''}</td><td>${g.active===false?'':`<button onclick="stopGb('${g.id}')">공구 종료</button>`}</td></tr>`).join('');$('prows').innerHTML=d.participants.slice(0,100).map(p=>`<tr><td>${p.createdAt||''}</td><td>${p.groupBuyId}</td><td>${p.name}</td><td>${p.phone}</td><td>${p.qty}</td><td>${p.receiveMethod||''}</td><td>${p.address||''}</td></tr>`).join('')}async function stopGb(id){if(!confirm('이 공동구매를 종료할까요?'))return;await api('/api/admin/groupbuys/'+encodeURIComponent(id),{method:'DELETE'});load()}$('loginBtn').onclick=login;$('create').onclick=async()=>{try{await api('/api/admin/groupbuys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value,price:+$('price').value||0,unit:$('unit').value,deadline:$('deadline').value,targetQty:+$('target').value||0,productId:$('product').value,description:$('desc').value})});['title','price','unit','deadline','target','desc'].forEach(x=>$(x).value='');await load();alert('공동구매 등록 완료')}catch(e){alert(e.message)}};if(token)show().catch(()=>{token='';sessionStorage.removeItem('iroomAdminToken')});</script></body></html>
