<script>
(()=>{'use strict';
const BUILD='6074', A='./assets/home2-v74/', DATA={"spring": [["딸기", "국내산", "500g (15~20과)", "26,000원", "spring-strawberry.webp"], ["화이트딸기", "국내산", "500g (12~16과)", "48,000원", "spring-white-strawberry.webp"], ["체리", "미국산", "500g (특대과)", "34,000원", "spring-cherry.webp"], ["샤인머스캣", "국내산", "2kg (3~4송이)", "46,000원", "spring-shine-muscat.webp"], ["자몽", "미국산", "3kg (6~8과)", "32,000원", "spring-grapefruit.webp"], ["한라봉", "제주산", "3kg (6~8과)", "38,000원", "spring-hallabong.webp"], ["키위", "국내산", "2kg (16~20과)", "28,000원", "spring-kiwi.webp"]], "summer": [["수박", "국내산", "6~8kg (1통)", "32,000원", "summer-watermelon.webp"], ["복숭아", "국내산", "2kg (6~8과)", "34,000원", "summer-peach.webp"], ["멜론", "국내산", "2수 (2kg 내외)", "42,000원", "summer-melon.webp"], ["샤인머스캣", "국내산", "2kg (3~4송이)", "46,000원", "summer-shine-muscat.webp"], ["자두", "국내산", "1.5kg (12~15과)", "24,000원", "summer-plum.webp"], ["살구", "국내산", "1kg (12~16과)", "26,000원", "summer-apricot.webp"], ["천도복숭아", "국내산", "2kg (7~9과)", "32,000원", "summer-nectarine.webp"]], "autumn": [["사과", "국내산", "2.5kg (6~10과)", "32,000원", "autumn-apple.webp"], ["배", "국내산", "3kg (5~7과)", "36,000원", "autumn-pear.webp"], ["샤인머스캣", "국내산", "2kg (3~4송이)", "46,000원", "autumn-shine-muscat.webp"], ["감", "국내산", "2.5kg (8~12과)", "28,000원", "autumn-persimmon.webp"], ["석류", "이스라엘", "2kg (5~7과)", "40,000원", "autumn-pomegranate.webp"], ["무화과", "국내산", "1.5kg (12~16과)", "32,000원", "autumn-fig.webp"], ["밤", "국내산", "1kg (대과)", "24,000원", "autumn-chestnut.webp"]], "winter": [["딸기", "국내산", "500g (특/1팩)", "19,000원", "winter-strawberry.webp"], ["한라봉", "제주산", "2.5kg (6~10과)", "38,000원", "winter-hallabong.webp"], ["레드향", "제주산", "2kg (5~8과)", "42,000원", "winter-redhyang.webp"], ["천혜향", "제주산", "2kg (5~8과)", "36,000원", "winter-cheonhyehyang.webp"], ["사과", "국내산", "2.5kg (6~10과)", "32,000원", "winter-apple.webp"], ["배", "국내산", "3kg (6~8과)", "36,000원", "winter-pear.webp"], ["감귤", "제주산", "3kg (특/로얄과)", "28,000원", "winter-mandarin.webp"]]}, seasons=['spring','summer','autumn','winter'];
let season='autumn', screenType='', current=null, toastTimer;
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
const safeGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}}, safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const detect=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter'};
function p(i){const a=DATA[season];return a[Math.max(0,Math.min(i,a.length-1))]}
function setSeason(s,save=true){season=s==='auto'?detect():s;if(save)safeSet('iroom-home2-v74-season',s);$('#mainImage').src=A+'page-'+season+'.webp?v='+BUILD;if(!$('#screen').hidden&&screenType)renderScreen(screenType)}
function renderScreen(type){screenType=type;$('#screenImage').src=A+'menu-'+type+'-'+season+'.webp?v='+BUILD;$('#screenImage').alt='이룸 '+DATA[season]+' '+type;$('#fruitHits').hidden=type!=='fruit';$('#screen').hidden=false;document.body.classList.add('lock');window.scrollTo(0,0)}
function closeScreen(){$('#screen').hidden=true;screenType='';document.body.classList.remove('lock')}
function closeDialogs(){['detailOverlay','simpleOverlay'].forEach(id=>$('#'+id).hidden=true);if($('#screen').hidden)document.body.classList.remove('lock')}
function openDetail(prod){if(!prod)return;current=prod;$('#detailImg').src=A+prod[4]+'?v='+BUILD;$('#detailTitle').textContent=prod[0];$('#detailKick').textContent=season.toUpperCase()+' SEASON';$('#detailDesc').textContent='이룸이 제철의 맛과 선도를 기준으로 엄선한 '+prod[0]+'입니다.';$('#detailOrigin').textContent='산지 · '+prod[1];$('#detailPack').textContent='구성 · '+prod[2];$('#detailPrice').textContent=prod[3];$('#qty').value=1;$('#detailOverlay').hidden=false;document.body.classList.add('lock')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,1800)}
function account(){closeScreen();$('#simpleTitle').textContent='MY IROOM · 계절 미리보기';$('#simpleText').textContent='자동은 현재 월 기준으로 계절 화면을 전환합니다.';$('#simpleBody').innerHTML='<div class="season-row"><button data-season="spring">봄</button><button data-season="summer">여름</button><button data-season="autumn">가을</button><button data-season="winter">겨울</button><button data-season="auto">자동</button></div>';$('#simpleOverlay').hidden=false;document.body.classList.add('lock')}
function simple(title,text){closeScreen();$('#simpleTitle').textContent=title;$('#simpleText').textContent=text;$('#simpleBody').innerHTML='';$('#simpleOverlay').hidden=false;document.body.classList.add('lock')}
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-menu]'); if(m){renderScreen(m.dataset.menu);return}
 if(e.target.closest('[data-screen-close]')){closeScreen();return}
 const mp=e.target.closest('[data-main-product]'); if(mp){openDetail(p(Number(mp.dataset.mainProduct)));return}
 const fp=e.target.closest('[data-menu-product]'); if(fp){openDetail(p(Number(fp.dataset.menuProduct)));return}
 if(e.target.closest('[data-account]')){account();return}
 if(e.target.closest('[data-search]')){simple('과일 검색','검색 기능은 현재 계절과 전체 계절 상품을 대상으로 연결할 수 있습니다.');return}
 if(e.target.closest('[data-cart]')){simple('장바구니','장바구니 기능 영역입니다.');return}
 if(e.target.closest('[data-dialog-close]')||e.target.classList.contains('overlay')){closeDialogs();return}
 const sb=e.target.closest('[data-season]'); if(sb){setSeason(sb.dataset.season,true);closeDialogs();toast('계절 화면을 전환했습니다.');return}
 const q=e.target.closest('[data-q]');if(q){let n=Math.max(1,parseInt($('#qty').value||'1',10)||1);$('#qty').value=Math.max(1,n+Number(q.dataset.q));return}
 if(e.target.closest('[data-add]')){toast((current?.[0]||'상품')+'을 장바구니에 담았습니다.');return}
 if(e.target.closest('[data-buy]')){toast('BUY NOW는 결제 API 연결 전 단계입니다.');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#screen').hidden)closeScreen();else closeDialogs()}});
const saved=safeGet('iroom-home2-v74-season');setSeason(saved&&['spring','summer','autumn','winter'].includes(saved)?saved:detect(),false);
})();
</script>
