<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이룸 fresh fruits</title>
<meta name="theme-color" content="#f8f7f2">
<link rel="stylesheet" href="./iroom_assets/iroom-v60-47-home2-main-mega-fix.css?v=60.47">
<script>(()=>{if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=60.47').catch(()=>{}),{once:true});})();</script>
</head>
<body>
<div class="h247-app">
<header class="h247-header">
  <a class="h247-logo" href="/home2"><img src="./iroom_assets/iroom-logo-user.png" alt="이룸 fresh fruits"></a>
  <nav class="h247-nav" aria-label="주요 메뉴">
    <button type="button" data-menu="fruit">과일</button>
    <button type="button" data-menu="gift">선물세트</button>
    <button type="button" data-menu="curation">과일 큐레이션</button>
    <button type="button" data-menu="routine">정기 루틴</button>
    <button type="button" data-menu="guide">과일 가이드</button>
    <button type="button" data-menu="brand">브랜드 스토리</button>
  </nav>
  <div class="h247-tools">
    <button type="button" data-info="search" aria-label="검색"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15 20 20"></path></svg></button>
    <button type="button" data-info="login" aria-label="로그인"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.4"></circle><path d="M5 20c.8-4 3-6 7-6s6.2 2 7 6"></path></svg></button>
    <button type="button" data-info="cart" aria-label="장바구니"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 10h10.7L20 7H6"></path><circle cx="9" cy="19" r="1"></circle><circle cx="17" cy="19" r="1"></circle></svg><span data-cart-count hidden>0</span></button>
  </div>
</header>

<div class="h247-dim" hidden></div>
<section class="h247-mega" hidden aria-label="상단 메뉴 창">
  <button class="h247-x" type="button" data-close-mega aria-label="닫기">×</button>
  <aside class="h247-mega-side">
    <h2 data-mega-title>과일</h2>
    <div data-mega-filters></div>
  </aside>
  <div class="h247-mega-content" data-mega-content></div>
</section>

<main class="h247-main">
  <section class="h247-hero">
    <div class="h247-copy">
      <small>PREMIUM FRESH FRUITS</small>
      <h1>좋은 과일이<br>일상을 더 특별하게</h1>
      <p>가장 신선한 제철의 맛을<br>당신의 식탁으로 전합니다.</p>
      <button type="button" data-menu="fruit" class="h247-cta">지금, 이룸의 과일 보기 <span>→</span></button>
      <div class="h247-pager"><i></i><b>01</b><span>02</span><span>03</span><span>‹</span><span>›</span></div>
    </div>
    <div class="h247-hero-image" aria-hidden="true"></div>
  </section>
</main>

<div class="h247-modal-bg" id="detailModal" aria-hidden="true">
  <section class="h247-detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <button class="h247-detail-x" type="button" data-close-detail aria-label="닫기">×</button>
    <div class="h247-detail-grid">
      <div class="h247-detail-image"><img id="detailImage" alt=""></div>
      <div class="h247-detail-copy">
        <small id="detailKicker"></small>
        <h2 id="detailTitle"></h2>
        <p id="detailDesc"></p>
        <div class="h247-detail-spec"><span>산지<b id="detailOrigin"></b></span><span>구성<b id="detailPack"></b></span><span>등급<b id="detailGrade"></b></span></div>
        <strong class="h247-detail-price" id="detailPrice"></strong>
        <div class="h247-qty"><button type="button" data-qty="minus">−</button><input id="detailQty" type="number" min="1" value="1"><button type="button" data-qty="plus">＋</button></div>
        <div class="h247-detail-actions"><button type="button" class="ghost" data-close-detail>닫기</button><button type="button" class="solid" data-cart-add>장바구니 담기</button></div>
      </div>
    </div>
  </section>
</div>

<div class="h247-modal-bg" id="infoModal" aria-hidden="true">
  <section class="h247-info" role="dialog" aria-modal="true">
    <button class="h247-detail-x" type="button" data-close-info>×</button>
    <small id="infoKicker"></small><h2 id="infoTitle"></h2><p id="infoText"></p>
  </section>
</div>

<script defer src="./iroom_assets/iroom-v60-47-home2-main-mega-fix.js?v=60.47"></script>
</div>
</body>
</html>
